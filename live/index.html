function instrFor(subId){return (DB.instructions||[]).filter(function(x){return x.sub===subId;}).slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));});}
function instrLast(subId){var a=instrFor(subId);return a.length?a[0].date:null;}
function daysSince(iso){return Math.floor((Date.now()-new Date(iso+'T00:00:00').getTime())/864e5);}
function instrDue(subId){var l=instrLast(subId);return !l||daysSince(l)>365;}
function fmtDate(iso){var p=String(iso).split('-');return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso;}
function qrTextInstr(subId){return baseUrl()+'#instr='+subId;}

    '<div class="field"><label>'+T.iName+'</label><input id="instrName" placeholder="Vor- und Nachname" value="'+esc((AUTH.profile&&AUTH.profile.name)||'')+'"></div>'+

window.setSig=function(v){state._sig=v;document.getElementById('sigA').classList.toggle('on',v==='Achtung');document.getElementById('sigG').classList.toggle('on',v==='Gefahr');};
function fileToB64(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=String(r.result||'');res(s.slice(s.indexOf(',')+1));};r.onerror=rej;r.readAsDataURL(file);});}
window.aiAnalyze=async function(file){
  if(!file)return;
  state.aiFile=file;
  openModal('SDB analysieren (KI)','<div class="ai-work"><div class="ai-spin"></div><div><b>KI liest das Sicherheitsdatenblatt…</b><small>Produktname, GHS, H-/P-Sätze, UN-Nr., Lagerklasse</small></div></div>');
  try{
    const b64=await fileToB64(file);
    const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name||'');
    const body=isPdf?{pdf_base64:b64}:{image_base64:b64,media_type:file.type||'image/jpeg'};
    const r=await sbc.functions.invoke('parse-sdb',{body:body});
    if(r.error){closeModal();toast('KI-Analyse fehlgeschlagen – bitte manuell ausfüllen.',false);return;}
    const d=r.data||{};
    if(d.configured===false){closeModal();toast('KI-Analyse noch nicht aktiviert – Datei wird trotzdem angehängt.',false);return;}
    state.aiExtract={hersteller:d.hersteller||'',h:d.h_saetze||'',p:d.p_saetze||'',un:d.un_nummer||'',lk:d.lagerklasse||''};
    if(d.signalwort)state._sig=d.signalwort;
    state.scanPrefill={barcode:(state.scanPrefill&&state.scanPrefill.barcode)||'',info:'',name:d.produktname||'',sig:d.signalwort||'',haz:Array.isArray(d.ghs)?d.ghs:[],ai:{h:d.h_saetze,un:d.un_nummer,lk:d.lagerklasse}};
    closeModal();toast('KI hat das SDB erkannt – bitte prüfen und speichern.');render();

async function uploadSdbFile(subId,file){
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-70);
  const path=orgId()+'/'+subId+'/'+Date.now().toString(36)+'_'+safe;
  const up=await sbc.storage.from('sds').upload(path,file,{upsert:false,contentType:file.type||'application/pdf'});
  if(up.error) throw up.error;
  const ins=await sbc.from('sds_documents').insert({organization_id:orgId(),substance_id:subId,storage_path:path,revisionsdatum:new Date().toISOString().slice(0,10),uploaded_by:AUTH.profile.id});
  if(ins.error) throw ins.error;
  return path;}

async function delCompanyDo(id){const {error}=await sbc.from('companies').delete().eq('id',id);closeModal();if(error){toast(error.message,false);return;}await loadDB();toast('Firma gelöscht');render();}
async function delLocationDo(id){const {error}=await sbc.from('storage_locations').delete().eq('id',id);if(state.activeLoc===id)state.activeLoc=null;closeModal();if(error){toast(error.message,false);return;}await loadDB();toast('Lagerort gelöscht');render();}

function defaultCompanyId(){const g=DB.companies.find(c=>c.group);return (g||DB.companies[0]||{}).id;}
async function saveErf(){const f=document.getElementById('erfForm');const name=f.name.value.trim();if(!name){toast('Produktname fehlt.',false);f.name.focus();return;}
  const mr=f.menge.value.trim();if(!mr){toast('Menge fehlt.',false);f.menge.focus();return;}
  const haz=[...f.querySelectorAll('.chip.on[data-haz]')].map(c=>c.dataset.haz);const sdb=f.sdb.value.trim();const sdbfile=(state.aiFile)||(f.sdbfile&&f.sdbfile.files&&f.sdbfile.files[0]);const bc=(f.barcode&&f.barcode.value.trim())||'';const sig=state._sig||'Achtung';
  const ex=state.aiExtract||{};
  const compId=state.activeLoc?location_(state.activeLoc).company:defaultCompanyId();
  if(!compId){toast('Keine Firma vorhanden – zuerst in der Verwaltung anlegen.',false);return;}
  try{
    const {data:sub,error:e1}=await sbc.from('substances').insert({organization_id:orgId(),produktname:name,hersteller:ex.hersteller||'unbekannt',signalwort:sig,ghs_piktogramme:haz,h_saetze:ex.h||'– (manuell, bitte ergänzen)',p_saetze:ex.p||'–',un_nummer:ex.un||null,lagerklasse:ex.lk||null,externer_barcode:bc||null,info_link:(/^https?:\/\//i.test(sdb)?sdb:null)}).select().single();
    if(e1){toast('Stoff: '+e1.message,false);return;}
    // Beitrag in den mandantenübergreifenden Schweizer Katalog (anonym, nur wenn Barcode vorhanden)
    if(bc){try{sbc.rpc('catalog_contribute',{p_barcode:bc,p_produktname:name,p_hersteller:ex.hersteller||null,p_signalwort:sig,p_ghs:haz,p_h:ex.h||null,p_p:ex.p||null,p_un:ex.un||null,p_lk:ex.lk||null,p_quelle:(state.scanPrefill&&state.scanPrefill.catalog)?'bestaetigt':'neu'}).then(()=>{},()=>{});}catch(_){}}
    if(sdbfile){try{await uploadSdbFile(sub.id,sdbfile);}catch(err){toast('SDB-Upload: '+(err&&err.message||err),false);}}
    else if(sdb){await sbc.from('sds_documents').insert({organization_id:orgId(),substance_id:sub.id,external_link:sdb,revisionsdatum:new Date().toISOString().slice(0,10),uploaded_by:AUTH.profile.id});}
    const qr='INST-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
    const {data:inst,error:e2}=await sbc.from('substance_instances').insert({organization_id:orgId(),substance_id:sub.id,company_id:compId,storage_location_id:state.activeLoc||null,gebindeart:f.gebinde.value,anzahl_gebinde:parseInt(f.anzahl.value||'1',10),menge_aktuell:parseFloat(mr),mengeneinheit:f.einheit.value,status:'Lager',internal_qr:qr}).select().single();
    if(e2){toast('Bestand: '+e2.message,false);return;}
    addHistory('Bestand erfasst',name+(state.activeLoc?' · '+location_(state.activeLoc).name:''),state.activeLoc?location_(state.activeLoc).company:'');
    state._sig=null;state.scanPrefill=null;state.aiExtract=null;state.aiFile=null;
    await loadDB();toast('Bestand erfasst · QR erstellt');goTo('detail',{sub:sub.id,inst:inst.id,reset:true,nav:'start'});setTimeout(()=>modalQr(inst.id),350);
  }catch(e){toast('Fehler: '+e.message,false);}}

async function saveLkDo(id){
  const sel=document.getElementById('lkForm');const v=(sel&&sel.lk.value)||null;
  const {error}=await sbc.from('substances').update({lagerklasse:v}).eq('id',id);
  if(error){toast('Lagerklasse: '+error.message,false);return;}
  const s=substance(id);if(s)s.lk=v;closeModal();toast('Lagerklasse gespeichert');render();
}

/* ---------- Auth-Gate (Login / Onboarding) ---------- */
function overlay(html){let o=document.getElementById('authOverlay');if(!o){o=document.createElement('div');o.id='authOverlay';o.style.cssText='position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto';document.body.appendChild(o);}o.innerHTML=html;}
function clearOverlay(){const o=document.getElementById('authOverlay');if(o)o.remove();}
function authNote(m,k){const n=document.getElementById('authNote');if(n)n.innerHTML=m?'<div class="notice '+(k||'info')+'" style="margin:0 0 10px">'+m+'</div>':'';}
function renderLogin(){overlay('<div style="max-width:390px;margin:0 auto;padding:44px 20px">'+
  '<div style="text-align:center;margin-bottom:18px"><div class="logo" style="margin:0 auto 12px;width:46px;height:46px;font-size:17px">St</div><h2 class="title" style="text-align:center;margin:0">StoffScan</h2><p class="sub" style="text-align:center">Gefahrstoff-Kataster · Anmeldung</p></div>'+
  '<div class="card" style="padding:18px"><div id="authNote"></div>'+
  '<div class="field"><label>E-Mail</label><input id="aEmail" type="email" autocomplete="email" placeholder="name@firma.ch"></div>'+
  '<div class="field"><label>Passwort</label><input id="aPw" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
  '<button class="btn" data-action="authLogin">Anmelden</button><div style="height:9px"></div>'+
  '<button class="btn secondary" data-action="authSignup">Neues Konto erstellen</button></div>'+
  '<div class="disclaimer" style="text-align:center">Betriebliche Unterstützung – ersetzt keine Beurteilung vor Ort.<br><a href="../app/" style="color:var(--accent)">Zur Login-freien Demo</a></div>'+
  '<div style="margin-top:12px">'+LEGAL_HTML+'</div></div>');}
function renderOnboarding(){overlay('<div style="max-width:390px;margin:0 auto;padding:44px 20px">'+
  '<h2 class="title">Willkommen bei StoffScan</h2><p class="sub">Erstelle deine Organisation. Du wirst automatisch Gruppen-/IMS-Admin.</p>'+
  '<div class="card" style="padding:18px"><div id="authNote"></div>'+
  '<div class="field"><label>Organisation / Firma</label><input id="obOrg" placeholder="Muster Bau AG"></div>'+
  '<div class="field"><label>Dein Name</label><input id="obName" placeholder="Vorname Nachname"></div>'+
  '<div class="field"><label>Plan</label><div class="plan-pick" id="onbPlans">'+PLANS.map(function(p){return '<button type="button" class="plan-opt'+(p.id===ONB_PLAN?' sel':'')+'" data-action="pickPlan" data-id="'+p.id+'"><span class="po-radio"></span><span class="po-txt"><b>'+p.name+'</b><small>'+p.desc+'</small></span><span class="po-price">'+p.price+(p.per?' '+p.per:'')+'</span></button>';}).join('')+'</div><div style="font-size:11.5px;color:var(--ink-3);margin-top:-6px">14 Tage gratis testen · jederzeit änderbar · Bezahlung später.</div></div>'+
  '<button class="btn" data-action="authCreateOrg">Organisation anlegen</button><div style="height:9px"></div>'+
  '<button class="btn ghost" data-action="logout">Abmelden</button></div></div>');}
async function doLogin(){const em=(document.getElementById('aEmail').value||'').trim(),pw=document.getElementById('aPw').value||'';if(!em||!pw){authNote('E-Mail und Passwort eingeben.','danger');return;}authNote('Anmelden…');const {error}=await sbc.auth.signInWithPassword({email:em,password:pw});if(error){authNote(error.message,'danger');return;}initApp();}
async function doSignup(){const em=(document.getElementById('aEmail').value||'').trim(),pw=document.getElementById('aPw').value||'';if(!em||pw.length<6){authNote('E-Mail angeben und Passwort mit mind. 6 Zeichen.','danger');return;}authNote('Konto wird erstellt…');const {data,error}=await sbc.auth.signUp({email:em,password:pw});if(error){authNote(error.message,'danger');return;}if(data.session){initApp();}else{authNote('Konto erstellt. Bitte E-Mail bestätigen und dann anmelden. (Für schnelle Tests: E-Mail-Bestätigung in Supabase → Auth deaktivieren.)','ok');}}
async function doCreateOrg(){const on=(document.getElementById('obOrg').value||'').trim(),nm=(document.getElementById('obName').value||'').trim();if(!on){authNote('Organisationsname fehlt.','danger');return;}authNote('Wird angelegt…');const {error}=await sbc.rpc('create_org_and_profile',{p_org_name:on,p_user_name:nm});if(error){authNote(error.message,'danger');return;}
  if(ONB_PLAN&&ONB_PLAN!=='starter'){try{await sbc.rpc('set_org_plan',{p_plan:ONB_PLAN});}catch(e){}}
  initApp();}
/* ---------- Export & Druck (Phase 2) ---------- */
function expScope(){return state.adminCompany||'';}
function expInsts(){const fc=expScope();return DB.instances.filter(i=>{const l=location_(i.loc);return !fc||(l&&l.company===fc);});}
function expLocs(){const fc=expScope();return DB.locations.filter(l=>!fc||l.company===fc);}
function orgName(){const g=DB.companies.find(c=>c.group);return (g&&g.name)||(DB.companies[0]&&DB.companies[0].name)||'StoffScan';}
function orgLogo(){return (AUTH.org&&AUTH.org.logo_url)||null;}
function baOrgName(){return (AUTH.org&&AUTH.org.name)||orgName();}
function baBrandHtml(){var lg=orgLogo();return lg?'<div class="ba-logo"><img class="ba-logo-img" src="'+lg+'" alt=""></div>':'<div class="ba-logo"><span class="logo">St</span>StoffScan</div>';}
function prLogoHtml(){return orgLogo()?'<img src="'+orgLogo()+'" style="max-height:44px;max-width:150px;object-fit:contain">':'<div class="pr-logo">StoffScan</div>';}
window.saveOrgLogo=function(file){if(!file)return;if(file.size>2*1024*1024){toast('Bild zu gross (max 2 MB).',false);return;}var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var data;if(img.width&&img.height){var mx=360,sc=Math.min(1,mx/img.width,mx/img.height);var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);try{c.getContext('2d').drawImage(img,0,0,c.width,c.height);data=c.toDataURL('image/png');}catch(e){data=r.result;}}else{data=r.result;}storeLogo(data);};img.onerror=function(){storeLogo(r.result);};img.src=r.result;};r.readAsDataURL(file);};
async function storeLogo(data){const {error}=await sbc.rpc('set_org_logo',{p_logo:data});if(error){toast('Logo: '+error.message,false);return;}if(AUTH.org)AUTH.org.logo_url=data;toast('Firmenlogo gespeichert.');render();}
async function rmOrgLogo(){const {error}=await sbc.rpc('set_org_logo',{p_logo:null});if(error){toast(error.message,false);return;}if(AUTH.org)AUTH.org.logo_url=null;toast('Logo entfernt');render();}
function logoCardHtml(){return '<div class="logo-card"><div class="logo-prev">'+(orgLogo()?'<img src="'+orgLogo()+'" alt="Logo">':'<span class="logo-ph">Logo</span>')+'</div>'+
  '<div class="logo-txt"><b>Firmenlogo</b><small>Erscheint auf Betriebsanweisungen und Instruktionsnachweisen.</small>'+
  '<div class="btn-row" style="margin-top:9px"><input type="file" id="logoFile" accept="image/png,image/jpeg,image/svg+xml" style="display:none" onchange="saveOrgLogo(this.files&&this.files[0])"><button class="btn secondary" onclick="document.getElementById(\'logoFile\').click()">'+ICO.plus+' Logo hochladen</button>'+(orgLogo()?'<button class="btn ghost" data-action="rmOrgLogo">Entfernen</button>':'')+'</div></div></div>';}
function instrNachweisPdf(subId){var s=substance(subId);if(!s)return;var a=instrFor(subId);
  var rows=a.length?a.map(function(x){var due=daysSince(x.date)>365;return '<tr><td>'+esc(x.name)+'</td><td>'+fmtDate(x.date)+'</td><td>'+(due?'fällig (über 12 Monate)':'aktuell')+'</td></tr>';}).join(''):'<tr><td colspan="3">Noch keine Instruktion erfasst.</td></tr>';
  var html='<div class="pr-h"><div>'+prLogoHtml()+'<div style="font-family:var(--mono);font-size:11px;color:#333;margin-top:5px">'+esc(baOrgName())+'</div></div>'+
    '<div class="pr-meta">Instruktionsnachweis<br>Stand '+new Date().toISOString().slice(0,10)+'</div></div>'+
    '<div class="pr-title">Instruktionsnachweis · '+esc(s.name)+'</div>'+
    '<p style="margin:-4px 0 12px;font-size:11px;color:#333">Betriebsanweisung für <b>'+esc(s.name)+'</b>'+(s.hersteller?' · '+esc(s.hersteller):'')+'. Kenntnisnahme durch die instruierten Personen:</p>'+
    '<table class="pr-tbl"><thead><tr><th style="width:55%">Name</th><th>Instruiert am</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p style="margin-top:14px;font-size:10px;color:#555">Digital erfasste Kenntnisnahme der Betriebsanweisung in StoffScan. Instruktionen sind jährlich zu wiederholen; nach 12 Monaten gilt ein Eintrag als «fällig».</p>'+prFooter();
  doPrint(html);}
function scopeName(){const fc=expScope();return fc?(company(fc)||{}).name:'ganze Gruppe';}
function sdbText(s){if(s.sdb.status==='fehlt')return 'SDB fehlt';if(s.sdb.status==='alt')return 'SDB '+(s.sdb.rev||'')+' (prüfen)';return 'SDB '+(s.sdb.rev||'ok');}
function ghsText(s){return (s.ghs||[]).map(g=>GHS_LABEL[g]||g).join(', ');}
function mengeText(i){return i.menge==null?'offen':(i.menge+' '+(i.einheit||''));}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);}

function exportCSV(){
  const insts=expInsts();
  if(!insts.length){toast('Keine Daten zum Exportieren.',false);return;}
  const cols=['Firma','Lagerort','Bereich','Produkt','Hersteller','Signalwort','GHS','H-Sätze','Menge','Einheit','Gebinde','Anzahl','Status','UN-Nummer','Barcode','SDB-Status','SDB-Revision','Interner QR'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[cols.map(q).join(';')];
  insts.forEach(i=>{const s=substance(i.sub),l=location_(i.loc),c=l?company(l.company):null;
    rows.push([c?c.name:'',l?l.name:'',l?l.bereich:'',s.name,s.hersteller,s.signal,ghsText(s),s.h,(i.menge==null?'':i.menge),i.einheit,i.gebinde,i.anzahl,i.status,s.un,s.barcode,s.sdb.status,s.sdb.rev||'',i.qr].map(q).join(';'));});
  const csv='﻿'+rows.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='StoffScan_Bestand_'+todayStr()+'.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('CSV exportiert ('+insts.length+' Zeilen)');
}

function doPrint(html,afterRender){
  const pa=document.getElementById('printArea');pa.innerHTML=html;
  if(afterRender)afterRender(pa);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),60);
}
function prHeader(sub){return '<div class="pr-h"><div><div class="pr-logo">StoffScan</div><div style="font-size:11px;color:#333">Gefahrstoff-Kataster</div></div>'+
  '<div class="pr-meta">'+orgName()+'<br>'+sub+'<br>Stand '+todayStr()+'</div></div>';}
function prFooter(){return '<div class="pr-foot">Betriebliche Unterstützung – ersetzt keine Beurteilung, Gefährdungsermittlung oder Instruktion vor Ort. · Erstellt mit StoffScan</div>';}

function printReport(){
  const insts=expInsts().slice().sort((a,b)=>{const la=location_(a.loc),lb=location_(b.loc);return ((la&&la.name)||'').localeCompare((lb&&lb.name)||'')||substance(a.sub).name.localeCompare(substance(b.sub).name);});
  if(!insts.length){toast('Keine Daten zum Drucken.',false);return;}
  let rows='';insts.forEach(i=>{const s=substance(i.sub),l=location_(i.loc),c=l?company(l.company):null;
    const warn=s.sdb.status==='fehlt';
    rows+='<tr><td>'+(c?c.name:'–')+'</td><td>'+(l?l.name+' · '+l.bereich:'–')+'</td><td><b>'+s.name+'</b><br>'+s.hersteller+'</td>'+
      '<td>'+mengeText(i)+'<br>'+i.anzahl+'× '+i.gebinde+'</td><td>'+s.signal+(ghsText(s)?'<br>'+ghsText(s):'')+'</td>'+
      '<td>'+s.un+'</td><td'+(warn?' class="pr-warn"':'')+'>'+sdbText(s)+'</td><td>'+i.status+'</td><td>'+i.qr+'</td></tr>';});
  const html=prHeader('Bestandsliste · '+scopeName())+
    '<div class="pr-title">Gefahrstoff-Bestand · '+scopeName()+' ('+insts.length+' Positionen)</div>'+
    '<table class="pr-tbl"><thead><tr><th>Firma</th><th>Lagerort</th><th>Produkt</th><th>Menge / Gebinde</th><th>Signal / GHS</th><th>UN</th><th>SDB</th><th>Status</th><th>Interner QR</th></tr></thead><tbody>'+rows+'</tbody></table>'+prFooter();
  doPrint(html);
}

function printLabels(){
  const locs=expLocs(),insts=expInsts();
  if(!locs.length&&!insts.length){toast('Keine Etiketten vorhanden.',false);return;}
  const jobs=[];let cells='';
  locs.forEach(l=>{const c=company(l.company),id='lq'+jobs.length;
    cells+='<div class="lbl loc"><div class="ltag">Lagerort</div><div class="lqr" id="'+id+'"></div><div class="lname">'+l.name+'</div><div class="lsub">'+l.bereich+' · '+(c?c.name:'')+'</div><div class="lcode">LOC-'+String(l.id).slice(0,10).toUpperCase()+'</div></div>';
    jobs.push([id,qrTextLoc(l)]);});
  insts.forEach(i=>{const s=substance(i.sub),l=location_(i.loc),c=l?company(l.company):null,id='lq'+jobs.length;
    cells+='<div class="lbl"><div class="ltag">Artikel</div><div class="lqr" id="'+id+'"></div><div class="lname">'+s.name+'</div><div class="lsub">'+(c?c.name+' · ':'')+(l?l.name:'')+' · '+mengeText(i)+'</div><div class="lcode">'+i.qr+'</div></div>';
    jobs.push([id,qrTextInst(i)]);});
  const html=prHeader('Etiketten-Druckbogen · '+scopeName())+
    '<div class="pr-title">Etiketten · '+scopeName()+' ('+locs.length+' Lagerorte, '+insts.length+' Artikel)</div>'+
    '<div class="lbl-grid">'+cells+'</div>'+prFooter();
  doPrint(html,()=>{jobs.forEach(j=>renderRealQr(j[0],j[1]));});
}

async function initApp(){
  const {data:{session}}=await sbc.auth.getSession();
  AUTH.user=session?session.user:null;
  if(!session){renderLogin();return;}
  let {data:prof,error}=await sbc.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error){renderLogin();authNote('Profil laden: '+error.message,'danger');return;}
  if(!prof){
    // Liegt eine Einladung zu dieser E-Mail vor? -> automatisch beitreten (Rolle/Firma aus Einladung).
    const r=await sbc.rpc('redeem_invite');
    if(!r.error && r.data){prof=(await sbc.from('profiles').select('*').eq('id',session.user.id).maybeSingle()).data;}
  }
  if(!prof){renderOnboarding();return;}
  AUTH.profile=prof;
  try{await loadDB();}catch(e){toast('Daten laden fehlgeschlagen: '+(e&&e.message||e),false);}
  clearOverlay();
  render();
  const qs=location.search||'';
  if(qs.indexOf('abo=success')>-1){toast('Danke! Dein Abo ist aktiv.');history.replaceState(null,'',location.pathname);}
  else if(qs.indexOf('abo=cancel')>-1){toast('Bezahlung abgebrochen – kein Plan gebucht.',false);history.replaceState(null,'',location.pathname);}
  const hsh=location.hash||'';if(hsh.indexOf('#open=')===0||hsh.indexOf('#instr=')===0||hsh.indexOf('#einsatz=')===0){setTimeout(()=>routeCode(hsh),80);}
}
initApp();
