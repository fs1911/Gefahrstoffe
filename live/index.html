<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>StoffScan – Live</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoffScan">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#191c19;--ink-2:#565d55;--ink-3:#868c82;
    --line:#e0e3dc;--line-2:#eef0ec;--bg:#eef1ee;--surface:#fff;--surface-2:#f4f6f3;
    --slate:#22332b;--slate-2:#2c4034;
    --accent:#0c6b4f;--accent-ink:#0a5540;
    --danger:#c0261f;--danger-bg:#fbe9e7;--danger-line:#eec6c0;
    --warn:#a85e05;--warn-bg:#f7edd6;--warn-line:#ecd6a4;
    --ok:#1f7a4d;--ok-bg:#e4f0e9;--ok-line:#c2ddcd;
    --green:#123b2c;--green-2:#1f7a4d;
    --ghs-red:#cc1717;
    --r:14px;--r-s:10px;--tap:52px;
    --font:"Hanken Grotesk",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
    --font-display:"Schibsted Grotesk","Hanken Grotesk",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45;font-size:16px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  .mono{font-family:var(--mono)}
  .app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

  /* Kopf */
  header.topbar{background:var(--slate);color:#fff;position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top)}
  .topbar-inner{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .iconbtn{width:42px;height:42px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:none;align-items:center;justify-content:center;flex:none}
  .iconbtn.show{display:flex}.iconbtn:active{background:rgba(255,255,255,.24)}.iconbtn svg{width:22px;height:22px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .logo{width:36px;height:36px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;flex:none;letter-spacing:.5px}
  .brand h1{font-size:16px;font-weight:600;margin:0;line-height:1.05}
  .brand small{display:block;font-size:11px;color:#aab6bf;font-weight:400}
  .firm-chip{display:flex;flex-direction:column;align-items:flex-end;gap:1px;background:rgba(255,255,255,.1);border:0;color:#fff;padding:7px 12px;border-radius:8px;flex:none;max-width:42%}
  .firm-chip:active{background:rgba(255,255,255,.2)}
  .firm-chip .lbl{font-size:9.5px;letter-spacing:1px;color:#9fb0ba;text-transform:uppercase;font-weight:600}
  .firm-chip .val{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
  #headSlot{margin-left:auto;flex:none}
  .head-cap{display:none;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:8px;height:40px;padding:0 14px;font-size:14px;font-weight:600}
  .head-cap svg{width:18px;height:18px}
  .head-cap:active{background:var(--accent-ink)}
  @media(min-width:980px){.head-cap{display:inline-flex}}

  /* Lagerort-Statusband */
  .locband{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:38;display:flex;align-items:stretch;border-bottom:2px solid var(--slate)}
  .locband.set{background:var(--green);color:#eaf3ee;border-bottom-color:var(--green-2)}
  .locband.unset{background:var(--warn-bg);color:#5e3800;border-bottom-color:var(--warn)}
  .lb-tap{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:10px 6px 10px 14px;border:0;background:transparent;color:inherit;text-align:left}
  .lb-tap:active{background:rgba(255,255,255,.06)}
  .lb-ico{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center}
  .locband.set .lb-ico{background:var(--green-2);color:#fff}
  .locband.unset .lb-ico{background:var(--warn);color:#fff}
  .lb-ico svg{width:20px;height:20px}
  .lb-txt{flex:1;min-width:0}
  .lb-kicker{display:block;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;opacity:.9;margin-bottom:2px}
  .locband.set .lb-kicker{color:#7fd3a4}
  .lb-main{display:block;font-size:14.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-sub{display:block;font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .lb-act{flex:none;border:0;margin:7px 8px 7px 0;border-radius:8px;padding:0 13px;font-size:13.5px;font-weight:700;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;min-height:42px;white-space:nowrap}
  .lb-act svg{width:18px;height:18px;flex:none}
  .locband.set .lb-act{background:#fff;color:var(--green-2)}
  .locband.set .lb-act:active{background:#dceee4}
  .locband.unset .lb-act{background:var(--warn);color:#fff}
  .locband.unset .lb-act:active{background:#7a4900}

  main{flex:1;padding:16px 14px 96px}
  .view{animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  h2.title{font-size:21px;margin:0 0 2px;font-weight:600}
  p.sub{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
  .label-h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:700;margin:22px 2px 9px;display:flex;align-items:center;gap:8px}
  .label-h:first-child{margin-top:4px}
  .label-h .cnt{font-family:var(--mono);color:var(--ink-2)}

  /* Start */
  .act-primary{width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:20px 18px;display:flex;align-items:center;gap:15px;text-align:left;margin-bottom:11px;box-shadow:0 2px 10px rgba(10,90,120,.22)}
  .act-primary:active{background:var(--accent-ink)}
  .act-primary .ico{width:52px;height:52px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .act-primary .ico svg{width:28px;height:28px}
  .act-primary b{font-size:18px;font-weight:600;display:block}
  .act-primary span{font-size:13px;color:#cce6ef}
  .act-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .act{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;min-height:104px}
  .act:active{background:var(--surface-2)}
  .act .ico{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
  .act .ico svg{width:24px;height:24px}
  .act b{font-size:13px;font-weight:600;line-height:1.2}
  .hb-banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--danger-bg);border:1px solid var(--danger-line);border-radius:10px;padding:13px 14px;margin-top:14px}
  .hb-banner:active{background:#f6ddd9}
  .hb-banner .ico{width:38px;height:38px;border-radius:9px;background:var(--danger);color:#fff;display:grid;place-items:center;flex:none}
  .hb-banner .ico svg{width:20px;height:20px}
  .hb-banner b{font-size:14.5px;color:var(--danger);display:block}
  .hb-banner span{font-size:12.5px;color:#7a1c14}
  .hb-banner .chev{margin-left:auto;color:var(--danger)}
  .hb-banner .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hb-banner.warn{background:var(--warn-bg);border-color:var(--warn-line)}
  .hb-banner.warn:active{background:#f0e2c4}
  .hb-banner.warn .ico{background:var(--warn)}
  .hb-banner.warn b{color:#5e3800}
  .hb-banner.warn span{color:#5e3800}
  .hb-banner.warn .chev{color:var(--warn)}

  /* Karten/Listen */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card + .card{margin-top:10px}
  .card.flag-danger{border-left:5px solid var(--danger)}
  .card.flag-warn{border-left:5px solid var(--warn)}
  .ctap{width:100%;text-align:left;background:transparent;border:0;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
  .ctap:active{background:var(--surface-2)}
  .ctap .ghs-row{flex:none}
  .cmain{flex:1;min-width:0}
  .ctitle{font-size:16px;font-weight:600;line-height:1.25}
  .cmeta{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.5}
  .cmeta b{color:var(--ink);font-weight:600}
  .chev{align-self:center;color:var(--ink-3);flex:none}
  .cbadges{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .firmtag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--slate);color:#fff;padding:3px 9px;border-radius:5px}
  .firmtag.alt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;line-height:1.3;white-space:nowrap}
  .badge svg{width:13px;height:13px}
  .b-danger{background:var(--danger-bg);color:var(--danger)}
  .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-ok{background:var(--ok-bg);color:var(--ok)}
  .b-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .b-signal{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.7px}

  .ghs-row{display:flex;gap:9px;flex-wrap:wrap}
  .ghs{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px}
  .ghs svg{width:46px;height:46px;display:block}
  .ghs small{font-size:9.5px;color:var(--ink-2);text-align:center;line-height:1.15;font-weight:500}
  .ghs.mini{width:auto}.ghs.mini svg{width:30px;height:30px}.ghs.mini small{display:none}
  .ghs.big{width:62px}.ghs.big svg{width:56px;height:56px}.ghs.big small{font-size:10.5px;font-weight:600;color:var(--ink)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:var(--tap);padding:0 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:15.5px;font-weight:600;width:100%}
  .btn:active{background:var(--accent-ink)}
  .btn svg{width:19px;height:19px}
  .btn.secondary{background:var(--surface);color:var(--accent);border-color:var(--accent)}
  .btn.secondary:active{background:var(--surface-2)}
  .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn-row{display:flex;gap:10px;margin-top:13px}

  /* ===== STOFFKARTE (überarbeitet) ===== */
  .sk-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 16px;margin-bottom:11px}
  .sk-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
  .sk-name{font-size:23px;font-weight:600;line-height:1.12;margin:0}
  .sk-mfr{color:var(--ink-2);font-size:13px;margin-top:3px}
  .sk-ghs{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
  .sk-ghs.none{color:var(--ink-3);font-size:12.5px;padding-top:12px}

  /* Bestand-Block: Lagerort-gebunden, grün markiert */
  .bestand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:11px}
  .bestand-h{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--green);color:#eaf3ee}
  .bestand-h svg{width:18px;height:18px;color:#7fd3a4}
  .bestand-h .tag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#7fd3a4}
  .bestand-h .where{font-size:13px;font-weight:600;color:#fff;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
  .bf-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:1px;background:var(--line-2)}
  .bf{background:var(--surface);padding:12px 14px}
  .bf .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700}
  .bf .v{font-size:16px;font-weight:600;margin-top:3px;line-height:1.2}
  .bf.menge .v{font-size:27px;line-height:1}
  .bf.menge .v.open{color:var(--warn);font-size:19px}
  .bf.full{grid-column:span 2}
  .bf .v.mono{font-family:var(--mono);font-size:14px}
  .qr-cta{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line-2);background:var(--surface-2)}
  .qr-cta .btn{min-height:48px}

  /* Stammdaten einklappbar */
  details.stamm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
  details.stamm summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
  details.stamm summary::-webkit-details-marker{display:none}
  details.stamm summary .tag{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#fff;background:var(--slate-2);padding:3px 7px;border-radius:5px}
  details.stamm summary .chev{margin-left:auto;transition:transform .2s}
  details.stamm[open] summary .chev{transform:rotate(90deg)}
  details.stamm .body{padding:4px 14px 14px;border-top:1px solid var(--line-2)}
  .phr{font-size:13px;color:var(--ink-2);line-height:1.55;padding:7px 0}
  .phr b{color:var(--ink)}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
  .kv:last-child{border-bottom:0}.kv .k{color:var(--ink-2)}.kv .v{font-weight:500;text-align:right}

  .notice{display:flex;gap:10px;border-radius:var(--r-s);padding:11px 12px;font-size:13px;margin-bottom:11px;align-items:flex-start}
  .notice svg{width:18px;height:18px;flex:none;margin-top:1px}
  .notice.danger{background:var(--danger-bg);border:1px solid var(--danger-line);color:#7a1c14}
  .notice.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:#5e3800}
  .notice.info{background:#e8f0f4;border:1px solid #c6dae3;color:#0a455c}
  .notice.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:#13452c}
  .notice b{font-weight:600}
  .disclaimer{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.5;padding:18px 8px 2px}
  .legal-links{display:flex;flex-wrap:wrap;gap:5px 8px;justify-content:center;align-items:center;font-size:11.5px}
  .legal-links a{color:var(--ink-3);font-weight:600}
  .legal-links a:hover{color:var(--accent)}
  .legal-links span{color:var(--ink-3);opacity:.45}
  /* Betriebsanweisung */
  .instr-card{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:var(--surface)}
  .instr-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .instr-head b{font-size:14.5px;color:var(--ink)}
  .instr-head small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
  .instr-badge{flex:none;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .instr-badge.due{background:var(--danger-bg);color:var(--danger)}
  .instr-badge.ok{background:var(--ok-bg);color:var(--ok)}
  .instr-li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .instr-li:last-of-type{border-bottom:0}
  .instr-li b{font-size:14px;color:var(--ink)}
  .instr-li small{display:block;color:var(--ink-3);font-size:12px;margin-top:1px}
  .instr-check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink);line-height:1.4;margin:4px 2px 2px;cursor:pointer}
  .instr-check input{margin-top:2px;flex:none;width:17px;height:17px;accent-color:var(--accent)}
  .instr-hint{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 auto 14px;max-width:820px;font-size:13.5px;color:var(--ink-2)}
  .instr-hint svg{flex:none;width:18px;height:18px;margin-top:1px}
  .ba-lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-right:auto;align-self:center}
  .ba-lang-b{border:0;background:var(--surface);color:var(--ink-2);font-family:var(--font);font-weight:700;font-size:12.5px;padding:8px 12px;cursor:pointer;border-left:1px solid var(--line)}
  .ba-lang-b:first-child{border-left:0}
  .ba-lang-b.on{background:var(--accent);color:#fff}
  .ba-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto}
  .ba-toolbar{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
  .ba-toolbar .btn{width:auto}
  .ba-scroll{padding:20px 14px 60px}
  .ba-doc{max-width:820px;margin:0 auto;background:#fff;color:#17201c;border:1px solid var(--line);border-radius:10px;padding:30px 34px;font-size:13.5px;line-height:1.5}
  .ba-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
  .ba-kick{font-weight:800;font-size:23px;letter-spacing:-.01em;color:#17201c}
  .ba-sub{font-size:12px;color:#7c857d}
  .ba-logo{display:flex;align-items:center;gap:8px;font-weight:700}
  .ba-logo .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
  .ba-logo-img{max-height:46px;max-width:160px;object-fit:contain}
  .ba-digi{display:flex;gap:9px;align-items:flex-start;margin-top:22px;padding:12px 14px;background:#f2f7f4;border:1px solid #d7e6dd;border-radius:9px;font-size:12px;color:#2c4a3c}
  .ba-digi svg{flex:none;width:16px;height:16px;color:var(--accent);margin-top:1px}
  .logo-card{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:14px;background:var(--surface)}
  .logo-prev{width:74px;height:56px;flex:none;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
  .logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
  .logo-ph{font-size:11px;color:var(--ink-3)}
  .logo-txt b{font-size:14.5px;color:var(--ink)}
  .logo-txt small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
  .dossier-card{display:flex;align-items:center;gap:13px;border:1px solid var(--accent);background:var(--surface);border-radius:13px;padding:14px 15px;margin-bottom:14px;box-shadow:0 6px 18px -12px rgba(12,107,79,.5)}
  .dossier-ic{width:42px;height:42px;flex:none;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .dossier-ic svg{width:22px;height:22px}
  .dossier-tx{flex:1;min-width:0}
  .dossier-tx b{font-size:15px;color:var(--ink);display:block}
  .dossier-tx small{color:var(--ink-3);font-size:12.5px;display:block;margin-top:1px}
  .dossier-card .btn{flex:none;width:auto}
  @media(max-width:560px){.dossier-card{flex-wrap:wrap}.dossier-card .btn{width:100%}}
  .ba-meta{width:100%;border-collapse:collapse;margin-bottom:16px}
  .ba-meta td{border:1px solid #d7dbd3;padding:7px 10px;width:50%;vertical-align:top;font-size:13px}
  .ba-meta td span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#7c857d;margin-bottom:2px}
  .ba-sigbar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:8px;margin-bottom:18px;font-size:15px}
  .ba-sigbar b{letter-spacing:.04em}
  .ba-sigbar.sig-danger{background:#fbe9e7;color:#c0261f}
  .ba-sigbar.sig-warn{background:#f7edd6;color:#a85e05}
  .ba-ghs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .ba-sec{margin-bottom:15px;padding-left:13px;border-left:3px solid #e0e4db}
  .ba-sec h3{font-size:14px;margin:0 0 6px;color:#17201c}
  .ba-sec p{margin:0 0 6px}
  .ba-sec ul{margin:0 0 6px;padding-left:18px}
  .ba-sec li{margin:3px 0}
  .ba-gef{border-left-color:#a85e05}
  .ba-schutz{border-left-color:var(--accent)}
  .ba-fall{border-left-color:#c0261f}
  .ba-empty{color:#7c857d}
  .ba-emo{font-weight:600;color:#17201c}
  .ba-foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:24px}
  .ba-foot div{border-top:1px solid #9aa295;padding-top:5px;font-size:10.5px;color:#7c857d;min-height:46px;display:flex;align-items:flex-end;gap:6px}
  .ba-note{margin-top:16px;font-size:10.5px;color:#7c857d;border-top:1px solid #e0e4db;padding-top:9px}
  @media print{
    body>*:not(.ba-overlay){display:none!important}
    .ba-overlay{position:static!important;background:#fff!important;overflow:visible!important}
    .ba-toolbar{display:none!important}
    .ba-scroll{padding:0!important}
    .ba-doc{border:0!important;max-width:none!important;border-radius:0!important;padding:0!important}
  }
  /* Abo / Plan */
  .abo-status{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5}
  .abo-status svg{width:18px;height:18px;color:var(--accent);flex:none;margin-top:1px}
  .abo-status b{color:var(--ink)}
  .plan-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--ok-bg);padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .plan-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:15px 15px 14px;margin-bottom:12px;background:var(--surface)}
  .plan-card.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .plan-card .pc-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .plan-card .pc-name{font-weight:700;font-size:16px;color:var(--ink)}
  .plan-card .pc-price{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;text-align:right}
  .plan-card .pc-price small{font-weight:600;color:var(--ink-3);font-size:12px}
  .plan-card .pc-note{font-size:11px;color:var(--ink-3);margin-top:2px}
  .plan-card .pc-desc{font-size:12.5px;color:var(--ink-2);margin:7px 0 9px}
  .plan-card ul.pc-feats{list-style:none;margin:0 0 13px;padding:0}
  .plan-card ul.pc-feats li{font-size:12.5px;color:var(--ink-2);padding:3px 0 3px 21px;position:relative}
  .plan-card ul.pc-feats li:before{content:"";position:absolute;left:3px;top:7px;width:9px;height:5px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
  .plan-tag{position:absolute;top:-9px;right:13px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.03em}
  .plan-card .btn{width:100%;justify-content:center}
  .plan-cur-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:6px;background:var(--ok-bg);color:var(--ok);border:0;border-radius:12px;padding:12px;font-weight:700;font-size:14px}
  .plan-cur-btn svg{width:16px;height:16px;flex:none}
  .plan-pick{display:flex;flex-direction:column;gap:8px;margin:2px 0 14px}
  .plan-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);text-align:left}
  .plan-opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .plan-opt .po-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .plan-opt.sel .po-radio{border-color:var(--accent)}
  .plan-opt.sel .po-radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .plan-opt .po-txt{flex:1}
  .plan-opt .po-txt b{font-size:14px;color:var(--ink)}
  .plan-opt .po-txt small{display:block;font-size:11.5px;color:var(--ink-3)}
  .plan-opt .po-price{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
  /* SDB → KI */
  .ai-work{display:flex;gap:14px;align-items:center;padding:14px 4px}
  .ai-work b{color:var(--ink);display:block;font-size:15px}
  .ai-work small{color:var(--ink-3);font-size:13px}
  .ai-spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);flex:none;animation:aiSpin .7s linear infinite}
  @keyframes aiSpin{to{transform:rotate(360deg)}}

  /* Felder/Filter */
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field label{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.6px;text-transform:uppercase}
  .field select,.field input,.field textarea{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:9px;padding:0 13px;background:var(--surface);color:var(--ink);font-weight:500}
  .field textarea{min-height:70px;padding:11px 13px;resize:vertical;font-weight:400}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:0 14px;height:42px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .chip svg{width:16px;height:16px;flex:none}
  .chip:active{background:var(--surface-2)}
  .chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
  .chip.hb.on{background:var(--danger);border-color:var(--danger)}
  .rescount{font-size:12.5px;color:var(--ink-3);margin:2px 2px 11px;font-weight:500}

  /* Scanner */
  .scanner{background:#0e171c;border-radius:var(--r);padding:24px 18px;text-align:center;position:relative;overflow:hidden;color:#cfe0e9;margin-bottom:15px}
  .scanner.fallback{background:#2a2113}
  .vf{width:160px;height:160px;margin:4px auto 13px;position:relative;border-radius:10px;background:repeating-linear-gradient(45deg,#141d23,#141d23 8px,#18222a 8px,#18222a 16px)}
  .scanner.fallback .vf{background:repeating-linear-gradient(45deg,#241c10,#241c10 8px,#2c2415 8px,#2c2415 16px)}
  .vf .corner{position:absolute;width:28px;height:28px;border:3px solid var(--accent)}
  .scanner.fallback .vf .corner{border-color:var(--warn)}
  .vf .tl{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
  .vf .tr{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
  .vf .bl{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 6px}
  .vf .br{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 6px 0}
  .vf .line{position:absolute;left:13px;right:13px;height:2px;background:#5fd08a;box-shadow:0 0 8px #5fd08a;animation:scan 1.8s ease-in-out infinite}
  .scanner.fallback .vf .line{background:#e0a13a;box-shadow:0 0 8px #e0a13a}
  @keyframes scan{0%,100%{top:16px}50%{top:142px}}
  .scanner p{font-size:13px;margin:0;color:#9fb4c0}
  .pick{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:9px;min-height:60px}
  .pick:active{background:var(--surface-2)}
  .pick .qr-ico{width:30px;height:30px;flex:none;color:var(--accent)}
  .pick .pm{flex:1;min-width:0}.pick .pm b{font-size:15px;display:block}.pick .pm small{font-size:12.5px;color:var(--ink-2)}
  .pick.new{border:2px dashed var(--accent);color:var(--accent)}.pick.new b{color:var(--accent)}

  /* QR/SDB */
  .qr-wrap{text-align:center;padding:4px 0}
  .qr-frame{display:inline-block;background:#fff;border:1px solid var(--line);padding:14px;border-radius:10px}
  .qr-code{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:12px;letter-spacing:1px}
  .qr-sub{font-size:13px;color:var(--ink-2);margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
  .sdb-doc{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px}
  .sdb-ico{width:48px;height:60px;flex:none;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);position:relative;display:grid;place-items:end center;padding-bottom:8px}
  .sdb-ico .fold{position:absolute;top:0;right:0;width:15px;height:15px;background:linear-gradient(225deg,var(--line) 50%,transparent 50%)}
  .sdb-ico span{font-family:var(--mono);font-size:10px;font-weight:700}

  /* ===== ADMIN (überarbeitet) ===== */
  .tabs{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2);min-height:42px;white-space:nowrap}
  .tab.active{background:var(--slate);color:#fff;border-color:var(--slate)}
  .tab .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--ink-2)}
  .tab.active .cnt{background:rgba(255,255,255,.2);color:#fff}
  .tab .cnt.alert{background:var(--danger);color:#fff}
  .admin-filter{margin-bottom:14px}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
  .stat-box{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
  .stat-box:active{background:var(--surface-2)}
  .stat-box.alert{border-left:5px solid var(--danger)}
  .stat-box.warnb{border-left:5px solid var(--warn)}
  .stat-box.on{outline:2px solid var(--accent);outline-offset:-1px}
  .stat-box .n{font-size:30px;font-weight:700;font-family:var(--mono);line-height:1}
  .stat-box.alert .n{color:var(--danger)}.stat-box.warnb .n{color:var(--warn)}
  .stat-box .t{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:5px}
  .stat-box .t svg{width:13px;height:13px}
  /* kompakte Admin-Arbeitszeile */
  .arow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .arow:active{background:var(--surface-2)}
  .arow.flag-danger{border-left:5px solid var(--danger)}
  .arow.flag-warn{border-left:5px solid var(--warn)}
  .arow .ag{flex:none}
  .arow .am{flex:1;min-width:0}
  .arow .at{font-size:14.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arow .as{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .arow .reason{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .arow .reason.d{background:var(--danger-bg);color:var(--danger)}
  .arow .reason.w{background:var(--warn-bg);color:var(--warn)}
  .arow .chev{color:var(--ink-3);flex:none}

  /* Firmen */
  .firma{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:13px;margin-bottom:9px}
  .firma:active{background:var(--surface-2)}
  .firma.group{background:var(--slate);color:#fff;border-color:var(--slate)}
  .firma .fm{flex:1;min-width:0}.firma b{font-size:15.5px;display:block}
  .firma .meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}.firma.group .meta{color:#b9c4cc}
  .firma .nums{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .firma .chev{color:var(--ink-3)}.firma.group .chev{color:#9fb0ba}
  .ficon{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--accent)}
  .firma.group .ficon{background:rgba(255,255,255,.14);color:#fff}
  .mini-num{font-size:11.5px;font-weight:600;font-family:var(--mono);padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .firma.group .mini-num{background:rgba(255,255,255,.12);color:#fff;border:0}
  .mini-num.d{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
  .mini-num.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}

  /* Lagerortdetail */
  .loc-hero{background:var(--green);color:#eaf3ee;border-radius:var(--r);padding:15px;margin-bottom:11px}
  .loc-hero .kicker{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:#7fd3a4}
  .loc-hero h2{margin:3px 0 2px;font-size:21px;color:#fff;line-height:1.15}
  .loc-hero .sub{color:#bcd4c8;font-size:13px;margin:0}
  .loc-hero .lh-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .loc-hero .lh-stat{background:rgba(255,255,255,.12);border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600}
  .loc-hero .lh-stat.d{background:var(--danger);color:#fff}
  .loc-hero .lh-stat.w{background:var(--warn);color:#fff}
  .loc-active-pill{display:inline-flex;align-items:center;gap:6px;background:var(--green-2);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:12px}

  /* Verlauf */
  .timeline{position:relative;padding-left:18px}
  .timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 15px}.tl-item:last-child{padding-bottom:0}
  .tl-item:before{content:"";position:absolute;left:-16px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
  .tl-item.alert:before{background:var(--danger)}
  .tl-item .t{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
  .tl-item .a{font-size:14px;font-weight:600;margin-top:1px}
  .tl-item .m{font-size:12.5px;color:var(--ink-2)}

  .empty{text-align:center;color:var(--ink-3);padding:30px 16px;font-size:13.5px}
  .empty svg{width:36px;height:36px;color:var(--line);margin-bottom:8px}

  /* Dashboard-Panels */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:14px}
  .panel-h .cnt{font-family:var(--mono);color:var(--ink-3);font-weight:600;margin-left:6px}
  .panel-h a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
  .panel-body{padding:12px 14px}
  .panel-body .arow:last-child{margin-bottom:0}
  .panel-body .timeline{padding-left:18px}
  .scanner{cursor:pointer}
  .scanner:active{filter:brightness(1.15)}
  .scan-graphic{display:block}
  #reader{display:none;width:100%}
  .scanner.live{padding:0;background:#000;cursor:default}
  .scanner.live .scan-graphic{display:none}
  .scanner.live #reader{display:block;min-height:250px}
  .scanner.live #reader video{display:block;width:100%!important;height:auto!important}
  .scan-cancel{display:none;position:absolute;top:8px;right:8px;z-index:6;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:8px;height:38px;padding:0 14px;font-weight:600;font-size:13px}
  .scanner.live .scan-cancel{display:block}
  .scan-msg{padding:14px}
  .linkbox{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:12.5px;word-break:break-all;color:var(--ink-2)}
  .linkbox svg{width:18px;height:18px;flex:none;color:var(--accent)}
  .scan-hint{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:#7fd3a4;font-weight:600}
  .ctx-line{display:flex;align-items:center;gap:8px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
  .ctx-line svg{width:16px;height:16px;flex:none}
  .userline{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2)}
  .userline svg{width:18px;height:18px;flex:none;color:var(--accent)}
  .userline b{color:var(--ink)}
  .userline .chg{margin-left:auto;color:var(--accent);font-weight:600;font-size:12.5px}
  @media(min-width:980px){.userline{display:none}}

  /* Verwaltung: Hinzufügen + Zeilen mit Löschen */
  .add-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;border:1.5px dashed var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;font-size:14.5px;font-weight:600;margin-bottom:12px}
  .add-btn:active{background:var(--surface-2)}
  .add-btn svg{width:18px;height:18px}
  .mrow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 10px 13px;margin-bottom:8px}
  .mrow .mg{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
  .mrow .mg svg{width:19px;height:19px}
  .mrow .mm{flex:1;min-width:0}
  .mrow .mt{font-size:14.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .ms{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .del-btn{flex:none;width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--danger);display:grid;place-items:center}
  .edit-btn{flex:none;width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--accent);display:grid;place-items:center}
  .edit-btn:active{background:var(--surface-2)}
  .edit-btn svg{width:18px;height:18px}
  .row-actions{display:flex;gap:7px;flex:none;margin-left:auto}
  .del-btn:active{background:var(--danger-bg)}
  .del-btn svg{width:18px;height:18px}
  .role-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

  /* Bottom-Nav */
  nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:var(--surface);border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}

  /* GHS-Spalte in Listenkarten: feste Breite → Text startet immer bündig */
  .ctap{gap:13px}
  .ctap .ghs-row{width:72px;align-content:flex-start;gap:6px;row-gap:6px;justify-content:flex-start}
  .ctap .ghs.mini svg{width:32px;height:32px}
  /* Formularfelder: sichtbarer Fokus-Ring, weichere Optik */
  .field select,.field input,.field textarea{border-color:var(--line);transition:border-color .12s, box-shadow .12s}
  .field select:focus,.field input:focus,.field textarea:focus,.hs-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(12,107,79,.14)}
  /* Chips: etwas kompakter, klarer */
  .chip{height:40px}
  /* Verwaltungs-Zeilen: mehr Luft, klare Aktionsflächen */
  .mrow{border-radius:12px;padding:12px 12px 12px 13px}
  .mrow .mt{font-weight:600}
  /* Sekundär-Buttons/Chips mit dezentem Hover-Feedback auf Touch */
  .btn{transition:background .12s, box-shadow .12s}
  .btn:not(.ghost):not(.secondary){box-shadow:0 1px 2px rgba(10,85,64,.18)}
  /* GHS-Piktogramm-Karten (Wissen) */
  .pk-head{display:flex;align-items:center;gap:14px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line-2)}
  .pk-head .ghs.big{width:60px;flex:none}
  .pk-head .ghs.big small{display:none}
  .pk-title b{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);display:block;line-height:1.2}
  .pk-title small{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
  .pk-sec{margin-top:10px}
  .pk-sec p{margin:5px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .pk-lbl{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:2px 8px;border-radius:5px}
  .pk-lbl.g{background:var(--danger-bg);color:var(--danger)}
  .pk-lbl.m{background:var(--ok-bg);color:var(--ok)}
  /* ===== Feinschliff v2: Desktop-Fixes ===== */
  .logo{background:var(--accent);color:#fff}
  .kpi-grid{margin-bottom:0}
  .hb-banner{margin:16px 0 0}
  .dash-cols{margin-top:16px}
  @media(min-width:980px){
    .sb-item svg{width:20px;height:20px;color:var(--ink-3)}
    .sb-item.active svg{color:var(--accent)}
    .sb-item:hover{background:var(--surface-2)}
  }
  .fab-ask{position:fixed;right:16px;bottom:80px;z-index:150;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:26px;padding:12px 18px 12px 14px;font-family:var(--font);font-weight:700;font-size:14.5px;box-shadow:0 8px 22px -6px rgba(12,107,79,.5);cursor:pointer}
  .fab-ask svg{width:20px;height:20px;flex:none}
  .fab-ask:active{transform:scale(.97)}
  @media(min-width:980px){.fab-ask{bottom:24px}}
  .chat-overlay{position:fixed;inset:0;z-index:340;background:rgba(13,18,22,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  @media(min-width:680px){.chat-overlay{align-items:center}}
  .chat-panel{background:var(--surface);width:100%;max-width:560px;height:84vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  @media(min-width:680px){.chat-panel{border-radius:16px;height:640px;max-height:88vh}}
  .chat-head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .chat-ci{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
  .chat-ci svg{width:19px;height:19px}
  .chat-hd b{font-size:15px;display:block}
  .chat-hd small{color:var(--ink-3);font-size:12px}
  .chat-x{margin-left:auto;background:transparent;border:0;font-size:24px;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 6px}
  .chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
  .chat-msg{max-width:88%;padding:11px 13px;border-radius:13px;font-size:14px;line-height:1.5}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .chat-msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
  .chat-dim{color:var(--ink-3);font-size:12.5px}
  .chat-ul{margin:7px 0 3px;padding-left:18px}
  .chat-ul li{margin:3px 0}
  .chat-emo{display:block;margin-top:8px;font-weight:700;color:var(--danger);font-size:12.5px}
  .chat-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chat-abtn{background:var(--surface-2);border:1px solid var(--line);color:var(--accent);border-radius:9px;padding:7px 11px;font-family:var(--font);font-weight:600;font-size:12.5px;cursor:pointer}
  .chat-abtn:active{background:var(--line-2)}
  .chat-typing{display:inline-flex;gap:4px;align-items:center}
  .chat-typing span{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:chatBlink 1s infinite}
  .chat-typing span:nth-child(2){animation-delay:.2s}.chat-typing span:nth-child(3){animation-delay:.4s}
  @keyframes chatBlink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .chat-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
  .chat-chip{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-family:var(--font);font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .chat-chip:active{background:var(--line-2)}
  .chat-input{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface)}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-family:var(--font);font-size:15px;background:var(--surface-2);color:var(--ink)}
  .chat-input input:focus{outline:0;border-color:var(--accent)}
  .chat-send{flex:none;width:46px;border:0;border-radius:11px;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
  .chat-send svg{width:19px;height:19px}
</style>
</head>

const GHS_LABEL={flamm:'entzündbar',oxid:'brandfördernd',explosiv:'explosiv',druckgas:'Druckgas',aetz:'ätzend',giftig:'giftig',reiz:'reizend',gesundheit:'Gesundheitsgefahr',umwelt:'umweltgef.'};
/* ===== Lagerklassen & Zusammenlagerung =====
   Quelle: Leitfaden «Lagerung gefährlicher Stoffe» (Kantone NWCH/TG/ZH + GVZ), 3. Aufl. 2018,
   Beilage 1 (Ablaufschema H-Sätze → Lagerklasse) und Beilage 2 (Zusammenlagerungstabelle). */
const LK_ORDER=['1','2','3','4.1','4.2','4.3','5','6.1','6.2','7','8','10/12','11/13','NG'];
const LK_INFO={
 '1':{name:'Explosive Stoffe',c:'#8a1c1c'},
 '2':{name:'Gase (verflüssigt / unter Druck)',c:'#1f6f8b'},
 '3':{name:'Entzündbare Flüssigkeiten',c:'#c65a11'},
 '4.1':{name:'Entzündbare Feststoffe',c:'#c65a11'},
 '4.2':{name:'Selbstentzündliche Stoffe',c:'#a23b2e'},
 '4.3':{name:'Mit Wasser entzündbare Gase bildend',c:'#1f6f8b'},
 '5':{name:'Brandfördernd / organische Peroxide',c:'#b07d0a'},
 '6.1':{name:'Giftige Stoffe',c:'#5b2a86'},
 '6.2':{name:'Ansteckungsgefährliche Stoffe',c:'#5b2a86'},
 '7':{name:'Radioaktive Stoffe',c:'#444'},
 '8':{name:'Ätzende / korrosive Stoffe',c:'#7a1c8a'},
 '10/12':{name:'Übrige Flüssigkeiten',c:'#4a5a3a'},
 '11/13':{name:'Übrige Feststoffe',c:'#4a5a3a'},
 'NG':{name:'Nicht-Gefahrenstoffe',c:'#5a6b5a'}
};
/* Ablaufschema (Priorität von oben nach unten – erste zutreffende Lagerklasse gewinnt) */
const H_SCHEME=[
 ['1',['H200','H201','H202','H203','H204','H205','H240','H241']],
 ['2',['H220','H221','H222','H223','H270','H280','H281']],
 ['5',['H242','H271','H272']],
 ['4.2',['H250','H251','H252']],
 ['4.3',['H260','H261']],
 ['4.1',['H228']],
 ['3',['H224','H225','H226']],
 ['6.1',['H300','H301','H304','H310','H311','H330','H331','H334','H340','H341','H350','H351','H360','H361','H370','H371','H372','H373']],
 ['8',['H290','H314','H318']],
 ['10/12',['H302','H312','H315','H317','H319','H332','H335','H336','H362','H400','H410','H411','H412','H413']]
];
/* Fallback über GHS-Piktogramme (wenn keine H-Sätze erfasst sind) */
const GHS_SCHEME=[['1','explosiv'],['2','druckgas'],['5','oxid'],['3','flamm'],['6.1','giftig'],['8','aetz'],['10/12','reiz'],['10/12','gesundheit'],['10/12','umwelt']];

function hCodes(str){var m=(str||'').toUpperCase().match(/H\d{3}/g);return m||[];}
function deriveLK(hStr,ghs){
  var codes=hCodes(hStr),i,j;
  for(i=0;i<H_SCHEME.length;i++){for(j=0;j<codes.length;j++){if(H_SCHEME[i][1].indexOf(codes[j])>=0)return H_SCHEME[i][0];}}
  var g=ghs||[];
  for(i=0;i<GHS_SCHEME.length;i++){if(g.indexOf(GHS_SCHEME[i][1])>=0)return GHS_SCHEME[i][0];}
  return null;
}
function lkOf(sub){if(!sub)return null;if(sub.lk)return sub.lk;return deriveLK(sub.h,sub.ghs);}

/* Zusammenlagerungsmatrix (Beilage 2, «Generelle Zusammenlagerung»).
   Gleiche Lagerklasse = grün. Aufgeführte Paare = gelb (bedingt). Alles Übrige = rot (getrennt). */
const ZL_YELLOW={};
['2|10/12','2|11/13','2|NG','3|10/12','4.1|10/12','4.1|11/13','6.1|8','6.1|10/12','6.1|11/13','8|10/12','8|11/13','10/12|11/13','10/12|NG','11/13|NG'].forEach(function(k){ZL_YELLOW[k]=1;});
/* Paare mit «*» im Leitfaden: zusätzlich Einzelfallprüfung im SDB / Grundchemikalientabelle */
const ZL_STAR={};
['3|5','3|6.1','3|8','3|10/12','5|6.1','5|8','5|10/12','6.1|8','6.1|10/12','8|10/12'].forEach(function(k){ZL_STAR[k]=1;});
function lkKey(a,b){return LK_ORDER.indexOf(a)<=LK_ORDER.indexOf(b)?a+'|'+b:b+'|'+a;}
function zlRate(a,b){if(!a||!b)return null;if(a===b)return'g';var k=lkKey(a,b);if(ZL_YELLOW[k])return'y';return'r';}
function zlStar(a,b){return !!ZL_STAR[lkKey(a,b)];}

/* Konflikte an einem Lagerort: gruppiert Bestände nach Lagerklasse, prüft alle Paare. */
function locLKmap(lid){var seen={};instsAtLoc(lid).forEach(function(i){var lk=lkOf(substance(i.sub));if(!lk)return;(seen[lk]=seen[lk]||[]).push(i);});return seen;}
function locConflicts(lid){
  var seen=locLKmap(lid),lks=Object.keys(seen),res=[],a,b,r;
  for(a=0;a<lks.length;a++)for(b=a+1;b<lks.length;b++){r=zlRate(lks[a],lks[b]);
    if(r==='r'||r==='y')res.push({a:lks[a],b:lks[b],rate:r,star:zlStar(lks[a],lks[b])});}
  res.sort(function(x,y){return (x.rate==='r'?0:1)-(y.rate==='r'?0:1);});
  return res;
}
function allZlConflicts(inScope){
  var out=[];DB.locations.forEach(function(l){if(inScope&&!inScope(l))return;var cf=locConflicts(l.id);if(cf.length)out.push({loc:l.id,cf:cf});});
  out.sort(function(x,y){return (y.cf.some(c=>c.rate==='r')?1:0)-(x.cf.some(c=>c.rate==='r')?1:0);});
  return out;
}

/* ---------- Badges & Anzeige ---------- */
function lkBadge(lk){if(!lk)return '<span class="lk-badge lk-unk">LK ?</span>';return '<span class="lk-badge" style="background:'+LK_INFO[lk].c+'">LK '+lk+'</span>';}
function lkChipPair(a,b,rate,star){return '<span class="zl-pair">'+lkBadge(a)+'<span class="zl-arrow">+</span>'+lkBadge(b)+(star?' <span title="Zusätzlich SDB prüfen">*</span>':'')+'</span>';}

function zlAlertHtml(cf){
  if(!cf.length)return '';
  var red=cf.filter(c=>c.rate==='r'),yel=cf.filter(c=>c.rate==='y');
  var cls=red.length?'r':'y';
  var ic='<span class="zi">'+ICO.warn+'</span>';
  var head=red.length?'<b>Zusammenlagerung nicht erlaubt</b>':'<b>Zusammenlagerung nur bedingt erlaubt</b>';
  var txt=red.length
    ? 'An diesem Lagerort liegen Stoffe, die getrennt gelagert werden müssen (Separat- bzw. Getrenntlagerung im gleichen Brandabschnitt).'
    : 'Zusammenlagerung nur unter Bedingungen – bitte Sicherheitsdatenblätter prüfen oder Fachperson beiziehen.';
  var pairs='<div style="margin-top:6px">'+cf.map(c=>lkChipPair(c.a,c.b,c.rate,c.star)).join('')+'</div>';
  var note=cf.some(c=>c.star)?'<div style="margin-top:6px;font-size:11.5px;opacity:.8">* Gefährliche Reaktionen möglich auch innerhalb ähnlicher Klassen – Einzelfallprüfung im SDB.</div>':'';
  return '<div class="zl-alert '+cls+'">'+ic+'<div>'+head+txt+pairs+note+'</div></div>';
}
function zlNoticeForLoc(lid){return zlAlertHtml(locConflicts(lid));}
/* Konflikte, die einen bestimmten Stoff an einem Lagerort betreffen */
function zlNoticeForInst(inst){
  if(!inst||!inst.loc)return '';
  var myLk=lkOf(substance(inst.sub));if(!myLk)return '';
  var rel=locConflicts(inst.loc).filter(c=>c.a===myLk||c.b===myLk);
  return zlAlertHtml(rel);
}

/* ---------- Lagerklasse manuell festlegen (Auto + überschreibbar) ---------- */
function lkOptions(cur){return LK_ORDER.map(function(k){return '<option value="'+k+'"'+(cur===k?' selected':'')+'>LK '+k+' – '+LK_INFO[k].name+'</option>';}).join('');}
function openLkEdit(subId){
  var s=substance(subId),auto=deriveLK(s.h,s.ghs),cur=s.lk||'';
  openModal('Lagerklasse festlegen',
    '<p class="phr" style="padding:0 0 10px">Automatisch abgeleitet (aus H-Sätzen / GHS): <b>'+(auto?('LK '+auto+' – '+LK_INFO[auto].name):'unbestimmt')+'</b></p>'+
    '<form id="lkForm"><div class="field"><label>Lagerklasse</label><select name="lk"><option value="">Automatisch'+(auto?(' (LK '+auto+')'):' (unbestimmt)')+'</option>'+lkOptions(cur)+'</select></div>'+
    '<div class="notice info" style="margin:4px 0">'+ICO.info+'<div>Leer = automatische Ableitung nach dem Ablaufschema des Leitfadens. Wähle eine Klasse, um sie fest zu überschreiben (z. B. fest vs. flüssig bei LK 10/12 ↔ 11/13).</div></div>'+
    '<div class="btn-row"><button type="button" class="btn ghost" data-action="closeModal">Abbrechen</button><button type="button" class="btn" data-action="saveLk" data-id="'+subId+'">Speichern</button></div></form>');
}

/* ---------- Live-Check im Erfassen-Formular ---------- */
function zlCheckErf(){
  var box=document.getElementById('zlCheck');if(!box)return;
  var lid=state.activeLoc;
  var chips=[].slice.call(document.querySelectorAll('#erfForm .chip.on[data-haz]')).map(function(c){return c.dataset.haz;});
  var newLk=deriveLK('',chips);
  var existing=lid?locLKmap(lid):{};
  var exLks=Object.keys(existing);
  if(!lid){box.innerHTML='<div class="notice info" style="margin:8px 0 0">'+ICO.info+'<div>Kein Lagerort gesetzt – Zusammenlagerungs-Prüfung erfolgt nach dem Setzen des Lagerorts.</div></div>';return;}
  var exHtml=exLks.length?('<div style="margin:2px 0 0;font-size:12px;color:var(--ink-2)">Bereits hier: '+exLks.map(function(k){return lkBadge(k);}).join(' ')+'</div>'):'<div style="margin:2px 0 0;font-size:12px;color:var(--ink-2)">Noch keine anderen Stoffe an diesem Lagerort.</div>';
  var conf=[];
  if(newLk){exLks.forEach(function(k){var r=zlRate(newLk,k);if(r==='r'||r==='y')conf.push({a:newLk,b:k,rate:r,star:zlStar(newLk,k)});});}
  var mine=newLk?('<div style="margin:6px 0 0;font-size:12px;color:var(--ink-2)">Neuer Stoff: '+lkBadge(newLk)+' <span style="opacity:.7">'+LK_INFO[newLk].name+'</span></div>'):'<div style="margin:6px 0 0;font-size:12px;color:var(--ink-3)">Gefahrmerkmale wählen für die Prüfung …</div>';
  box.innerHTML='<div class="wk-card" style="margin:10px 0 0;padding:12px 13px"><div style="font-weight:700;font-size:13px;color:var(--ink)">Zusammenlagerungs-Prüfung</div>'+exHtml+mine+(conf.length?zlAlertHtml(conf):(newLk&&exLks.length?'<div class="zl-alert g" style="margin:8px 0 0"><span class="zi">'+ICO.ok+'</span><div><b>Zusammenlagerung erlaubt.</b> Keine Konflikte mit den vorhandenen Stoffen.</div></div>':''))+'</div>';
}

const H_GROUPS=[
 ['Physikalische Gefahren',['H200','H201','H202','H203','H204','H205','H220','H221','H222','H223','H224','H225','H226','H228','H229','H240','H241','H242','H250','H251','H252','H260','H261','H270','H271','H272','H280','H281','H290']],

function pseudoQr(seed,size){size=size||140;const n=21,m=size/n;let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  function fnd(x,y){return '<rect x="'+(x*m)+'" y="'+(y*m)+'" width="'+(7*m)+'" height="'+(7*m)+'" fill="#13171b"/><rect x="'+((x+1)*m)+'" y="'+((y+1)*m)+'" width="'+(5*m)+'" height="'+(5*m)+'" fill="#fff"/><rect x="'+((x+2)*m)+'" y="'+((y+2)*m)+'" width="'+(3*m)+'" height="'+(3*m)+'" fill="#13171b"/>';}
  let c='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;h=(h*1103515245+12345)>>>0;if(h>>16&1)c+='<rect x="'+(x*m)+'" y="'+(y*m)+'" width="'+m+'" height="'+m+'" fill="#13171b"/>';}
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="#fff"/>'+c+fnd(0,0)+fnd(n-7,0)+fnd(0,n-7)+'</svg>';}

function routeCode(raw){
  let full=String(raw||'').trim();
  // 0) Instruktions-QR -> Betriebsanweisung im Bestätigen-Modus
  const hi=full.indexOf('#instr=');
  if(hi>=0){const sid=full.slice(hi+7).trim();if(substance(sid)){toast('Betriebsanweisung geöffnet');openBA(sid,true);return true;}}
  const he=full.indexOf('#einsatz=');
  if(he>=0){const lid=full.slice(he+9).trim();if(location_(lid)){toast('Einsatzkarte geöffnet');openEinsatz(lid);return true;}}
  // 1) Eigener Deep-Link (App-QR)
  const h=full.indexOf('#open=');
  if(h>=0){const t=full.slice(h+6).trim();
    if(t.indexOf('LOC-')===0){const lid=t.slice(4);const l=location_(lid);if(l){state.activeLoc=lid;addHistory('Lagerort gescannt',l.name+' · '+company(l.company).name,l.company);toast('Lagerort gesetzt: '+l.name);goTo('scanArt',{reset:true,nav:'scan'});return true;}}
    const inst=DB.instances.find(x=>x.qr===t);if(inst){state.activeLoc=inst.loc;toast('Stoffkarte geöffnet');goTo('detail',{sub:inst.sub,inst:inst.id,reset:true,nav:'start'});return true;}
  }
  // 2) Interner QR direkt (ohne Hash)
  const inst2=DB.instances.find(x=>x.qr===full);
  if(inst2){state.activeLoc=inst2.loc;toast('Stoffkarte geöffnet');goTo('detail',{sub:inst2.sub,inst:inst2.id,reset:true,nav:'start'});return true;}
  // 3) Externe URL -> als Infoseite/SDB-Link hinterlegen (nicht selbst alles ablegen)
  if(/^https?:\/\//i.test(full)){
    openModal('Link erkannt','<div class="notice info" style="margin-bottom:12px">'+ICO.info+'<div>Hinter dem Code liegt eine Internetseite. Diese wird als <b>Link hinterlegt</b> (z. B. Hersteller-Infoseite / SDB) – die App speichert nicht alles selbst.</div></div>'+
      '<div class="linkbox">'+ICO.doc+'<span>'+full+'</span></div>'+
      '<div class="btn-row"><button class="btn secondary" data-action="openExtLink" data-id="'+encodeURIComponent(full)+'">'+ICO.doc+' Seite öffnen</button>'+
      '<button class="btn" data-action="captureWithLink" data-id="'+encodeURIComponent(full)+'">'+ICO.plus+' Als Stoff anlegen + Link</button></div>');
    return true;
  }
  // 4) Externer Barcode -> bekannter Artikel oder Neuanlage mit übernommenem Barcode
  const sub=DB.substances.find(s=>s.barcode&&s.barcode===full);
  if(sub){const i=state.activeLoc?DB.instances.find(x=>x.sub===sub.id&&x.loc===state.activeLoc):null;toast('Artikel erkannt: '+sub.name);goTo('detail',{sub:sub.id,inst:i?i.id:null,reset:true,nav:'start'});return true;}
  // 5) Externer Barcode -> Schweizer Katalog abfragen (mandantenübergreifend), sonst Neuanlage
  catalogRoute(full);return true;
}

  let cat=null;

  if(cat){
    state.aiExtract={hersteller:cat.hersteller,h:cat.h_saetze,p:cat.p_saetze,un:cat.un_nummer,lk:cat.lagerklasse};state._sig=cat.signalwort||'Achtung';

let camInst=null;
function stopCamera(cb){if(camInst){const c=camInst;camInst=null;c.stop().then(()=>{try{c.clear();}catch(e){}cb&&cb();}).catch(()=>{cb&&cb();});}else{cb&&cb();}}
function startCamera(){
  const box=document.getElementById('scanBox');const r=document.getElementById('reader');if(!box||!r)return;
  box.classList.add('live');
  if(!window.isSecureContext){
    r.innerHTML='<div class="scan-msg"><div class="notice info" style="margin:0">'+ICO.info+'<div><b>Kamera-Scan nur über HTTPS.</b> Diese Datei läuft lokal/ohne sichere Adresse. App online stellen (z. B. Netlify Drop) und am Handy öffnen – dann startet die Kamera direkt hier. Für die Demo unten manuell wählen.</div></div></div>';
    return;
  }
  if(!window.Html5Qrcode){r.innerHTML='<div class="scan-msg"><div class="notice warn" style="margin:0">'+ICO.warn+'<div>Scanner-Bibliothek nicht geladen (keine Internetverbindung?).</div></div></div>';return;}
  r.innerHTML='';
  stopCamera(()=>{try{camInst=new Html5Qrcode('reader',{verbose:false});
    var fmts;try{var F=Html5QrcodeSupportedFormats;fmts=[F.QR_CODE,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR,F.DATA_MATRIX];}catch(e){fmts=undefined;}
    const cfg={fps:12,qrbox:function(w,h){const m=Math.floor(Math.min(w,h)*0.78);return {width:m,height:m};},aspectRatio:1.0};
    if(fmts)cfg.formatsToSupport=fmts;
    camInst.start({facingMode:'environment'},cfg,txt=>{stopCamera(()=>routeCode(txt));},function(){})
      .catch(()=>{r.innerHTML='<div class="scan-msg"><div class="notice warn" style="margin:0">'+ICO.warn+'<div>Kamerazugriff verweigert oder nicht verfügbar. Bitte Kamerafreigabe erlauben – oder unten manuell wählen.</div></div></div>';camInst=null;});
  }catch(e){r.innerHTML='<div class="scan-msg"><div class="notice warn" style="margin:0">'+ICO.warn+'<div>Kamera-Start fehlgeschlagen.</div></div></div>';}});
}

function sdbFrom(rows){ // neuestes SDB je Stoff -> {status,rev,link,path,url}
  if(!rows||!rows.length) return {status:'fehlt',rev:null,link:null,path:null,url:null};
  const r=rows.slice().sort((a,b)=>String(b.revisionsdatum||'').localeCompare(String(a.revisionsdatum||'')))[0];
  const path=r.storage_path||null,url=r.external_link||null;
  const name=path?path.split('/').pop().replace(/^[a-z0-9]+_/i,''):(url||'SDB');
  if(!r.revisionsdatum) return {status:'ok',rev:null,link:name,path,url};
  const age=(Date.now()-new Date(r.revisionsdatum).getTime())/(365.25*24*3600*1000);
  return {status:age>3?'alt':'ok',rev:String(r.revisionsdatum).slice(0,7),link:name,path,url};
}

/* ---------- «Frag StoffScan» – Chat auf den eigenen Daten (Block 7) ---------- */
const CHAT_SUG=['Wo steht Aceton?','Erste Hilfe bei Hautkontakt mit Bremsenreiniger','Welche Stoffe haben kein SDB?','Was darf ich nicht zusammenlagern?'];
function chatEsc(s){return esc(s);}
function chatFindSubs(q){q=' '+q.toLowerCase()+' ';var out=[];DB.substances.forEach(function(s){var n=s.name.toLowerCase();var hit=q.indexOf(n)>=0;if(!hit){var ws=n.split(/[\s\/,()]+/).filter(function(w){return w.length>3;});hit=ws.some(function(w){return q.indexOf(w)>=0;});}if(hit)out.push(s);});return out;}
function chatLocLabel(locId){var l=location_(locId);if(!l)return 'ohne Lagerort';var c=company(l.company);return l.name+' · '+l.bereich+(c?' · '+c.name:'');}
function chatMenge(i){return (i.menge==null?'?':i.menge)+' '+(i.einheit||'')+' · '+i.anzahl+'× '+i.gebinde;}
function chatGhsWords(s){return (s.ghs||[]).map(function(g){return GHS_LABEL[g]||g;}).join(', ');}
function chatSubActions(s){return '<div class="chat-act"><button class="chat-abtn" data-action="chatOpenSub" data-id="'+s.id+'">Stoffkarte</button><button class="chat-abtn" data-action="chatOpenBA" data-id="'+s.id+'">Betriebsanweisung</button></div>';}
function chatSubCard(s){var insts=DB.instances.filter(function(i){return i.sub===s.id;});
  var loc=insts.length?insts.map(function(i){return '<li>'+chatEsc(chatLocLabel(i.loc))+' – '+chatEsc(chatMenge(i))+'</li>';}).join(''):'<li>kein Bestand erfasst</li>';
  return '<b>'+chatEsc(s.name)+'</b> · '+chatEsc(s.hersteller||'unbekannt')+'<br><span class="chat-dim">'+chatEsc(s.signal||'')+(chatGhsWords(s)?' · '+chatEsc(chatGhsWords(s)):'')+(s.un&&s.un!=='–'?' · UN '+chatEsc(s.un):'')+(lkOf(s)?' · LK '+lkOf(s):'')+' · SDB '+(s.sdb.status==='ok'?'vorhanden':s.sdb.status)+'</span><ul class="chat-ul">'+loc+'</ul>'+chatSubActions(s);}
function chatFirstAid(s){var ghs=s?(s.ghs||[]):[];var extra='';
  if(ghs.indexOf('aetz')>-1)extra='<li><b>Ätzend:</b> Augen/Haut sofort 15+ Minuten spülen, kontaminierte Kleidung entfernen, sofort Arzt.</li>';
  else if(ghs.indexOf('giftig')>-1||ghs.indexOf('gesundheit')>-1)extra='<li><b>Giftig:</b> bei Unwohlsein sofort 145 Tox Info Suisse anrufen, SDB/Etikett bereithalten.</li>';
  else if(ghs.indexOf('flamm')>-1)extra='<li><b>Entzündbar:</b> Dämpfe nicht einatmen, für Frischluft sorgen.</li>';
  return (s?'Erste Hilfe für <b>'+chatEsc(s.name)+'</b>'+(chatGhsWords(s)?' ('+chatEsc(chatGhsWords(s))+')':'')+':':'Allgemeine Erste Hilfe:')+
    '<ul class="chat-ul"><li><b>Augen:</b> 10–15 Min. bei geöffnetem Lid mit Wasser spülen, Arzt.</li><li><b>Haut:</b> benetzte Kleidung entfernen, mit Wasser und Seife reinigen.</li><li><b>Einatmen:</b> an die frische Luft bringen, bei Beschwerden Arzt.</li><li><b>Verschlucken:</b> Mund ausspülen, kein Erbrechen, sofort Arzt.</li>'+extra+'</ul><span class="chat-emo">Notfall: 144 Sanität · 145 Tox Info Suisse · 118 Feuerwehr</span>'+(s?chatSubActions(s):'');}
function askLocal(qraw){
  var q=(qraw||'').toLowerCase().trim();
  if(!q)return 'Stell mir eine Frage zu deinen Gefahrstoffen.';
  var subs=chatFindSubs(q);var s=subs[0];
  var isAid=/erste hilfe|hautkontakt|\bhaut\b|\bauge|augen|eingeatmet|einatmen|verschluck|notfall|spritzer|verätz/.test(q);
  var isWhere=/\bwo\b|steht|befindet|lagert|standort|welchem lager|welcher lager/.test(q);
  var isSdb=/sdb|sicherheitsdatenblatt|datenblatt/.test(q);
  var isZl=/zusammen|zusammenlager|gemeinsam lagern|darf ich .*lagern|nicht lagern|neben/.test(q);
  var isDisp=/entsorg|abfall|wegwerfen|veva/.test(q);
  var isCount=/wie viele|anzahl|übersicht|overview|wie viel/.test(q);
  var isBA=/betriebsanweisung|anweisung/.test(q);
  if(isAid)return chatFirstAid(s);
  if(isBA&&s)return 'Die Betriebsanweisung für <b>'+chatEsc(s.name)+'</b> ist auf Knopfdruck erzeugt – aus H-/P-Sätzen und GHS.'+chatSubActions(s);
  if(isWhere){
    if(!s)return 'Zu welchem Stoff? Nenne mir den Produktnamen, z. B. «Wo steht Aceton?».';
    var insts=DB.instances.filter(function(i){return i.sub===s.id;});
    if(!insts.length)return '<b>'+chatEsc(s.name)+'</b> ist im Stoffstamm erfasst, aber aktuell ohne Bestand an einem Lagerort.'+chatSubActions(s);
    return '<b>'+chatEsc(s.name)+'</b> steht an '+insts.length+' Ort'+(insts.length>1?'en':'')+':<ul class="chat-ul">'+insts.map(function(i){return '<li>'+chatEsc(chatLocLabel(i.loc))+' – '+chatEsc(chatMenge(i))+' · '+chatEsc(i.status)+'</li>';}).join('')+'</ul>'+chatSubActions(s);
  }
  if(isSdb){
    var miss=DB.instances.map(function(i){return substance(i.sub);}).filter(function(x,ix,arr){return x.sdb.status==='fehlt'&&arr.indexOf(x)===ix;});
    if(s&&/\b(hat|von|für)\b/.test(q)&&!/welche|alle|liste/.test(q))return '<b>'+chatEsc(s.name)+'</b>: SDB '+(s.sdb.status==='ok'?'vorhanden (Stand '+s.sdb.rev+')':s.sdb.status==='alt'?'älter als 3 Jahre (Stand '+s.sdb.rev+') – prüfen':'fehlt – bitte ergänzen')+'.'+chatSubActions(s);
    if(!miss.length)return 'Alle Stoffe mit Bestand haben ein hinterlegtes Sicherheitsdatenblatt. 👍';
    return miss.length+' Stoff'+(miss.length>1?'e':'')+' ohne SDB:<ul class="chat-ul">'+miss.map(function(x){return '<li>'+chatEsc(x.name)+' · '+chatEsc(x.hersteller||'')+'</li>';}).join('')+'</ul>';
  }
  if(isZl){
    if(subs.length>=2){var a=lkOf(subs[0]),b=lkOf(subs[1]);var r=(a&&b)?zlRate(a,b):null;
      var verd=r==='g'?'dürfen zusammen gelagert werden':r==='y'?'nur bedingt – SDB prüfen und Einzelfall beurteilen':r==='r'?'müssen getrennt gelagert werden':'– Lagerklasse unklar';
      return '<b>'+chatEsc(subs[0].name)+'</b> (LK '+(a||'?')+') und <b>'+chatEsc(subs[1].name)+'</b> (LK '+(b||'?')+') '+verd+'.';}
    var zc=allZlConflicts();
    if(!zc.length)return 'Aktuell keine Zusammenlagerungs-Konflikte an deinen Lagerorten. 👍';
    return zc.length+' Lagerort'+(zc.length>1?'e':'')+' mit Konflikt. Nenne zwei Stoffe für eine konkrete Prüfung, z. B. «Darf ich Aceton neben Natronlauge lagern?».';
  }
  if(isDisp)return (s?'<b>'+chatEsc(s.name)+'</b>: ':'')+'Reste und leere, nicht gereinigte Gebinde als Sonderabfall gemäss VeVA entsorgen – nicht in Kanalisation oder Hauskehricht. Details in Abschnitt 13 des SDB.'+(s?chatSubActions(s):'');
  if(isCount){var noSdb=DB.instances.map(function(i){return substance(i.sub);}).filter(function(x,ix,arr){return x.sdb.status==='fehlt'&&arr.indexOf(x)===ix;}).length;
    return 'Übersicht: <b>'+DB.instances.length+'</b> Bestände, <b>'+DB.substances.length+'</b> Stoffe im Stamm, <b>'+DB.locations.length+'</b> Lagerorte, <b>'+noSdb+'</b> ohne SDB.';}
  if(s)return chatSubCard(s);
  return 'Dazu finde ich nichts Passendes. Ich helfe bei: <b>wo</b> ein Stoff steht, <b>Erste Hilfe</b>, fehlende <b>SDB</b>, <b>Zusammenlagerung</b> und Mengen-Übersichten. Beispiel: «Wo steht Aceton?».';
}

function chatSend(forced){
  if(chatBusy)return;
  var inp=document.getElementById('chatInput');

  if(!t)return;
  if(inp)inp.value='';
  var chips=document.getElementById('chatChips');if(chips)chips.style.display='none';
  chatAddUser(t);chatBusy=true;chatTyping(true);
  chatAnswer(t,function(html){chatTyping(false);chatAddBot(html);chatBusy=false;});
}

function chatContext(){
  var subs=DB.substances.map(function(s){var insts=DB.instances.filter(function(i){return i.sub===s.id;}).map(function(i){var l=location_(i.loc);return {ort:l?(l.name+' · '+l.bereich):'ohne Lagerort',firma:l?((company(l.company)||{}).name||''):'',menge:i.menge,einheit:i.einheit,gebinde:i.anzahl+'x '+i.gebinde,status:i.status};});

function chatMdToHtml(t){return chatEsc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n{2,}/g,'<br><br>').replace(/\n[-•]\s?/g,'<br>• ').replace(/\n/g,'<br>');}
async function chatAnswer(q,cb){
  try{const {data,error}=await sbc.functions.invoke('ask-stoffscan',{body:{question:q,context:chatContext()}});
    if(!error&&data&&data.configured!==false&&data.answer){cb(chatMdToHtml(String(data.answer)));return;}
  }catch(e){}
  setTimeout(function(){cb(askLocal(q));},250);

  var today=new Date().toLocaleDateString('de-CH');
  var who=(typeof curUser==='function'&&curUser())?curUser().name:'';

  var incompl=insts.filter(function(i){return i.menge==null;});
  var zl=allZlConflicts(function(l){return !fc||l.company===fc;});
  var instrDueSubs=subs.filter(function(s){return instrDue(s.id);});
  // Mängelliste (offene Punkte) nach Priorität
  var m=[];
  noSdb.forEach(function(s){m.push(['Hoch','SDB fehlt',esc(s.name)+' – Sicherheitsdatenblatt beschaffen und hinterlegen.']);});
  zl.forEach(function(e){e.cf.forEach(function(c){if(c.rate==='r')m.push(['Hoch','Zusammenlagerung',esc(location_(e.loc).name)+': LK '+c.a+' + LK '+c.b+' getrennt lagern.']);});});
  instrDueSubs.forEach(function(s){m.push(['Mittel','Instruktion fällig',esc(s.name)+' – Mitarbeitende (neu) instruieren.']);});
  oldSdb.forEach(function(s){m.push(['Mittel','SDB veraltet',esc(s.name)+' – SDB älter als 3 Jahre, Aktualität prüfen.']);});
  zl.forEach(function(e){e.cf.forEach(function(c){if(c.rate==='y')m.push(['Mittel','Zusammenlagerung',esc(location_(e.loc).name)+': LK '+c.a+' + LK '+c.b+' nur bedingt – SDB prüfen.']);});});
  incompl.forEach(function(i){m.push(['Tief','Menge fehlt',esc(substance(i.sub).name)+' · '+esc(location_(i.loc)?location_(i.loc).name:'–')+' – Menge ergänzen.']);});
  var prio={Hoch:0,Mittel:1,Tief:2};m.sort(function(a,b){return prio[a[0]]-prio[b[0]];});

  // 1) Deckblatt
  var cover='<div class="dos-cover"><div class="dos-logo">'+prLogoHtml()+'</div>'+
    '<div class="dos-kick">Prüf-Dossier · Gefahrstoffe</div>'+
    '<div class="dos-org">'+esc(orgName())+'</div>'+
    '<table class="dos-meta"><tr><td>Umfang</td><td>'+esc(scope)+'</td></tr><tr><td>Erstellt am</td><td>'+today+'</td></tr>'+(who?'<tr><td>Verantwortlich</td><td>'+esc(who)+'</td></tr>':'')+'<tr><td>Inhalt</td><td>Kennzahlen · offene Punkte · Gefahrstoffliste · SDB-Status · Zusammenlagerung · Instruktionsnachweise · Betriebsanweisungen</td></tr></table>'+

  var kpis='<div class="dos-kpis">'+
    '<div class="dos-kpi"><b>'+insts.length+'</b><span>Bestände</span></div>'+
    '<div class="dos-kpi"><b>'+subs.length+'</b><span>Stoffe</span></div>'+
    '<div class="dos-kpi"><b>'+DB.locations.filter(function(l){return !fc||l.company===fc;}).length+'</b><span>Lagerorte</span></div>'+
    '<div class="dos-kpi'+(noSdb.length?' bad':'')+'"><b>'+noSdb.length+'</b><span>ohne SDB</span></div>'+

  var rows=insts.map(function(i){var s=substance(i.sub),l=location_(i.loc),c=l?company(l.company):null;var warn=s.sdb.status==='fehlt';
    return '<tr><td>'+(c?esc(c.name):'–')+'</td><td>'+(l?esc(l.name+' · '+l.bereich):'–')+'</td><td><b>'+esc(s.name)+'</b><br>'+esc(s.hersteller||'')+'</td><td>'+esc(mengeText(i))+'<br>'+i.anzahl+'× '+esc(i.gebinde)+'</td><td>'+esc(s.signal||'')+(ghsText(s)?'<br>'+esc(ghsText(s)):'')+'</td><td>'+esc(s.un||'–')+'</td><td>'+(lkOf(s)||'–')+'</td><td'+(warn?' class="pr-warn"':'')+'>'+esc(sdbText(s))+'</td></tr>';}).join('');
  var page3=dossierHead('Gefahrstoffliste')+'<div class="pr-title">Gefahrstoffliste · '+esc(scope)+' ('+insts.length+' Positionen)</div>'+

function einsatzData(locId){
  var l=location_(locId);if(!l)return null;var c=company(l.company);
  var insts=instsAtLoc(locId);
  var subMap={};insts.forEach(function(i){(subMap[i.sub]=subMap[i.sub]||{s:substance(i.sub),insts:[]}).insts.push(i);});
  var subs=Object.keys(subMap).map(function(k){return subMap[k];}).sort(function(a,b){return a.s.name.localeCompare(b.s.name);});
  var ghsAll={};subs.forEach(function(o){(o.s.ghs||[]).forEach(function(g){ghsAll[g]=1;});});
  var ghs=PIKTO.map(function(p){return p.k;}).filter(function(k){return ghsAll[k];});
  var lks={};subs.forEach(function(o){var lk=lkOf(o.s);if(lk)lks[lk]=1;});
  var lkList=Object.keys(lks).sort();
  var byUnit={},gebinde=0;insts.forEach(function(i){gebinde+=(i.anzahl||0);if(i.menge!=null)byUnit[i.einheit||'']=(byUnit[i.einheit||'']||0)+i.menge;});
  var codes={};subs.forEach(function(o){hCodes(o.s.h).forEach(function(cd){codes[cd]=1;});});
  function g(k){return !!ghsAll[k];}
  var flamm=g('flamm')||['H220','H221','H222','H223','H224','H225','H226'].some(function(x){return codes[x];});
  var druck=g('druckgas');
  var aetz=g('aetz')||codes['H314']||codes['H318'];
  var tox=g('giftig')||g('gesundheit')||codes['H330']||codes['H331'];
  var oxid=g('oxid');
  var umwelt=g('umwelt')||['H400','H410','H411','H412','H413'].some(function(x){return codes[x];});
  var wreact=['H260','H261'].some(function(x){return codes[x];});
  var loesch,loeschWarn='';
  if(wreact){loesch='KEIN Wasser – reagiert mit Wasser. Mit Metallbrandpulver / trocken löschen, Behälter kühlen.';}
  else if(flamm){loesch='Schaum, Löschpulver, CO₂; Sprühwasser zum Kühlen der Gebinde.';loeschWarn='Kein Wasser-Vollstrahl auf brennende Flüssigkeiten – Verspritzen und Brandausbreitung.';}
  else if(oxid){loesch='Viel Wasser / Sprühwasser (brandfördernd – Ersticken nicht möglich).';}
  else{loesch='Wasser, Schaum, Löschpulver oder CO₂.';}
  var gefahr=[];
  if(flamm)gefahr.push('Entzündbare Flüssigkeiten/Dämpfe – Explosionsgefahr, alle Zündquellen fernhalten.');
  if(druck)gefahr.push('Druckgasflaschen – Berstgefahr bei Erwärmung (BLEVE); aus Deckung kühlen, Bereich weiträumig absperren.');
  if(aetz)gefahr.push('Ätzende Stoffe – Verätzungsgefahr für Haut und Augen; Körper- und Augenschutz.');
  if(tox)gefahr.push('Giftige Brand- und Zersetzungsgase möglich – umluftunabhängiger Atemschutz tragen.');
  if(umwelt)gefahr.push('Gewässergefährdend – Löschwasser zurückhalten, Eintrag in Kanalisation/Gewässer verhindern.');
  if(wreact)gefahr.push('Reagiert mit Wasser – kein Wasser einsetzen.');
  if(!gefahr.length)gefahr.push('Keine besonderen Gefahren aus den erfassten Einstufungen – Angaben vor Ort verifizieren.');
  return {l:l,c:c,insts:insts,subs:subs,ghs:ghs,lkList:lkList,byUnit:byUnit,gebinde:gebinde,loesch:loesch,loeschWarn:loeschWarn,gefahr:gefahr};
}

function notfallData(subId){
  var s=substance(subId);if(!s)return null;
  var codes={};hCodes(s.h).forEach(function(c){codes[c]=1;});var ghs=s.ghs||[];
  function g(k){return ghs.indexOf(k)>-1;}
  var aetz=g('aetz')||codes['H314']||codes['H318'];
  var flamm=g('flamm')||['H220','H221','H222','H223','H224','H225','H226'].some(function(x){return codes[x];});
  var giftig=g('giftig')||g('gesundheit')||['H300','H301','H310','H311','H330','H331'].some(function(x){return codes[x];});
  var umwelt=g('umwelt')||['H400','H410','H411','H412','H413'].some(function(x){return codes[x];});
  var druck=g('druckgas');var asp=!!codes['H304'];
  var reiz=g('reiz')||['H315','H319','H335'].some(function(x){return codes[x];});
  var eh=[
    {k:'Augen',t:'Sofort 15 Minuten mit Wasser spülen, Lid offen halten, Kontaktlinsen entfernen.'+((aetz||reiz)?' Ätzend/reizend – danach zum Arzt.':'')},
    {k:'Haut',t:'Benetzte Kleidung entfernen, Haut mit viel Wasser und Seife waschen.'+(aetz?' Bei Verätzung sofort zum Arzt.':'')},
    {k:'Einatmen',t:'Betroffene an die frische Luft bringen, beengende Kleidung öffnen.'+((giftig||flamm)?' Bei Atemnot oder Benommenheit → 144.':'')},
    {k:'Verschlucken',t:'Mund ausspülen, KEIN Erbrechen auslösen.'+(asp?' Aspirationsgefahr – auf keinen Fall Erbrechen!':'')+' Sofort 145 (Tox Info Suisse) anrufen.'}
  ];
  var loesch,loeschWarn='';
  if(flamm){loesch='Schaum, Löschpulver oder CO₂.';loeschWarn='Kein Wasser-Vollstrahl – die Flüssigkeit verspritzt und breitet den Brand aus.';}
  else if(g('oxid')){loesch='Viel Wasser / Sprühwasser (brandfördernd – Ersticken nicht möglich).';}
  else{loesch='Wasser, Schaum, Löschpulver oder CO₂ – dem Umfeld anpassen.';}
  if(druck)loeschWarn=(loeschWarn?loeschWarn+' ':'')+'Druckgasflasche aus Deckung kühlen – Explosionsgefahr, Bereich räumen.';
  var spill=[];
  if(flamm)spill.push('Alle Zündquellen aus – kein Licht/Schalter betätigen, nicht rauchen (Explosionsgefahr).');
  spill.push('Unbeteiligte fernhalten, für Lüftung sorgen, Schutzhandschuhe und Brille tragen.');
  if(druck)spill.push('Undichte Gasflasche möglichst ins Freie bringen, Zündquellen fernhalten.');
  spill.push('Mit Bindemittel (Ölbinder, Sand) aufnehmen und in einen gekennzeichneten Behälter geben.');
  if(aetz)spill.push('Ätzend – nicht mit blossen Händen; vorsichtig aufnehmen bzw. neutralisieren.');
  if(umwelt)spill.push('Nicht in Kanalisation, Boden oder Gewässer gelangen lassen.');
  return {s:s,eh:eh,loesch:loesch,loeschWarn:loeschWarn,spill:spill,tags:ghs.map(function(k){return GHS_LABEL[k]||k;})};
}

function lotseScore(){
  var subs=DB.substances.filter(lotseInStock);var total=0,green=0;
  subs.forEach(function(s){total+=2;if(s.sdb.status==='ok')green+=1;if(!(typeof instrDue==='function'&&instrDue(s.id)))green+=1;});
  DB.instances.forEach(function(i){total+=1;if(i.menge!=null)green+=1;});
  DB.locations.forEach(function(l){total+=1;if(!locConflicts(l.id).length)green+=1;});
  return {pct:total?Math.round(green/total*100):100,green:green,total:total};
}

function emplLimits(s){
  var codes={};hCodes(s.h).forEach(function(c){codes[c]=1;});var ghs=s.ghs||[];
  function any(a){return a.some(function(x){return codes[x];});}
  function pick(a){return a.filter(function(x){return codes[x];});}
  var CMR1=['H340','H350','H350i','H360','H360F','H360D','H360FD','H360Fd','H360Df'];
  var CMR2=['H341','H351','H361','H361f','H361d','H361fd'];
  var LACT=['H362'];
  var ACUTE=['H300','H301','H310','H311','H330','H331'];
  var CORR=['H314'],RESP=['H334'],STOT=['H370','H372'];
  var SENS=['H317'],IRR=['H315','H319','H335'];
  var preg='keine',pc=[];
  if(any(CMR1)){preg='verboten';pc=pick(CMR1);}
  else if(any(CMR2)||any(STOT)||any(ACUTE)){preg='beurteilung';pc=pick(CMR2.concat(STOT,ACUTE));}
  if(any(LACT)){preg=(preg==='verboten'?'verboten':'stillverbot');pc=pc.concat(pick(LACT));}
  var youth='keine',yc=[];
  if(any(CMR1)||any(CMR2)||any(ACUTE)||any(CORR)||any(RESP)||any(STOT)){youth='verboten';yc=pick(CMR1.concat(CMR2,ACUTE,CORR,RESP,STOT));}
  else if(any(SENS)||any(IRR)||ghs.indexOf('flamm')>-1){youth='aufsicht';yc=pick(SENS.concat(IRR));}
  return {preg:preg,pregCodes:pc,youth:youth,youthCodes:yc,restricted:(preg!=='keine'||youth!=='keine')};
}

var STFV_CATS={explosiv:[100,'Explosive Stoffe'],giftig:[2000,'Giftige Stoffe'],druckgas:[2000,'Gase unter Druck'],oxid:[5000,'Brandfördernde Stoffe'],flamm:[5000,'Entzündbare Flüssigkeiten'],umwelt:[2000,'Gewässergefährdende Stoffe']};
function stfvThreshold(s){
  var ghs=s.ghs||[],codes={};hCodes(s.h).forEach(function(c){codes[c]=1;});
  var best=null;
  ['explosiv','giftig','druckgas','oxid','flamm'].forEach(function(k){if(ghs.indexOf(k)>-1){var c=STFV_CATS[k];if(!best||c[0]<best.t)best={t:c[0],n:c[1],k:k};}});
  if(ghs.indexOf('umwelt')>-1&&(codes['H400']||codes['H410']||codes['H411'])){var c=STFV_CATS.umwelt;if(!best||c[0]<best.t)best={t:c[0],n:c[1],k:'umwelt'};}
  return best;
}
function stfvKg(i){if(i.menge==null)return 0;var u=(i.einheit||'').toLowerCase();return i.menge*(u==='t'?1000:1);}
function stfvLevel(pct){return pct>=100?'r':pct>=80?'y':pct>=50?'i':'';}
function stfvForSub(subId,insts){var s=substance(subId);if(!s)return null;var thr=stfvThreshold(s);if(!thr)return null;
  var kg=0;insts.forEach(function(i){if(i.sub===subId)kg+=stfvKg(i);});
  if(kg<=0)return null;var pct=Math.round(kg/thr.t*100);
  return {sub:subId,kg:kg,thr:thr.t,cat:thr.n,pct:pct,level:stfvLevel(pct)};
}
function stfvScopeInsts(fc){return DB.instances.filter(function(i){return !fc||location_(i.loc).company===fc;});}
function stfvList(fc){var insts=stfvScopeInsts(fc),seen={},out=[];
